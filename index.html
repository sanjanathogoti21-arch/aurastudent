<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3D38">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AuraStudent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>AuraStudent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: left rail on desktop, bottom tab bar on phones. Calendar-first; the dashboard leads with a dark "aura" hero that carries the week-health ring. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E8EFEC; --line:#D8E2DE;
  --ink:#10201D; --ink-2:#47595A; --ink-3:#6F8280;
  --accent:#0B8A7B; --accent-ink:#06665B; --accent-soft:#D5F0EA; --on-accent:#FFFFFF;
  --gold:#B96F00; --gold-soft:#FBEACB;
  --bad:#C2362B; --bad-soft:#FBE1DE; --ok:#1B8A4C; --ok-soft:#DBF3E4;
  --c-class:#2F6FDE; --c-exam:#D13C3C; --c-hack:#C77D0A; --c-job:#8A4FD6; --c-study:#0B8A7B;
  --c-comm:#D6479A; --c-pers:#5E6E69; --c-rest:#4F9D3A;
  --hero-a:#0B3D38; --hero-b:#0A2735; --hero-fg:#F2FBF9; --hero-fg2:#A9CFC8;
  --r-ok:#34E0C8; --r-mid:#FFC15E; --r-bad:#FF8A80;
  --shadow:0 1px 2px rgba(16,32,29,.06),0 8px 24px -12px rgba(16,32,29,.18);
  --font-d:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1311; --surface:#121D1A; --surface-2:#1A2824; --line:#25362F;
  --ink:#E8F2EF; --ink-2:#A6BAB4; --ink-3:#7F938D;
  --accent:#2DD4BF; --accent-ink:#5EE6D3; --accent-soft:#12312C; --on-accent:#04201C;
  --gold:#FFB340; --gold-soft:#3A2B0E;
  --bad:#FF7A70; --bad-soft:#3A1816; --ok:#4ADE80; --ok-soft:#12301F;
  --c-class:#6EA2FF; --c-exam:#FF7B7B; --c-hack:#FFB340; --c-job:#B98CFF; --c-study:#2DD4BF;
  --c-comm:#FF8CC6; --c-pers:#9DB0AA; --c-rest:#8FD66E;
  --hero-a:#0F4D45; --hero-b:#0A2230;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1311; --surface:#121D1A; --surface-2:#1A2824; --line:#25362F;
  --ink:#E8F2EF; --ink-2:#A6BAB4; --ink-3:#7F938D;
  --accent:#2DD4BF; --accent-ink:#5EE6D3; --accent-soft:#12312C; --on-accent:#04201C;
  --gold:#FFB340; --gold-soft:#3A2B0E;
  --bad:#FF7A70; --bad-soft:#3A1816; --ok:#4ADE80; --ok-soft:#12301F;
  --c-class:#6EA2FF; --c-exam:#FF7B7B; --c-hack:#FFB340; --c-job:#B98CFF; --c-study:#2DD4BF;
  --c-comm:#FF8CC6; --c-pers:#9DB0AA; --c-rest:#8FD66E;
  --hero-a:#0F4D45; --hero-b:#0A2230;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(26px,4vw,36px);font-weight:700;line-height:1.08}
h2{font-size:19px;font-weight:650}
h3{font-size:16px;font-weight:650}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .sm{font-size:13px}
.ic{flex:none}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;align-self:start;display:flex;flex-direction:column;gap:4px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--ink-2);font-weight:500;text-align:left}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.nav .badge{margin-left:auto}
.side .grow{flex:1}
.main{min-width:0;padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mhead{display:none}
.tabbar{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;transition:background .15s,transform .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;height:38px;padding:0}
.in{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-family:var(--font-d);font-size:17px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:13px}
.chip button{border:0;background:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:inherit;padding:0}
.chip button:hover{background:rgba(0,0,0,.1)}
.chip.plain{padding:4px 11px;background:var(--surface-2);color:var(--ink-2)}
.chip.match{padding:4px 11px;background:var(--ok-soft);color:var(--ok)}
.chip.gap{padding:4px 11px;background:var(--gold-soft);color:var(--gold)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px;color:var(--hero-fg);background:radial-gradient(900px 380px at 88% -10%,rgba(52,224,200,.30),transparent 60%),radial-gradient(520px 320px at 0% 120%,rgba(255,193,94,.20),transparent 60%),linear-gradient(135deg,var(--hero-a),var(--hero-b));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(28px,4.6vw,44px);color:var(--hero-fg)}
.hero .sub{color:var(--hero-fg2);margin-top:8px;max-width:52ch}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:var(--hero-fg)}
.hero .btn:hover{background:rgba(255,255,255,.18)}
.hero .btn.pri{background:var(--r-ok);border-color:var(--r-ok);color:#04201C}
.next{margin-top:20px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;gap:14px;align-items:center;max-width:520px}
.next .when{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.1}
.next small{color:var(--hero-fg2);display:block}
.ring{position:relative;width:168px;height:168px;display:grid;place-items:center;text-align:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--font-d);font-size:46px;line-height:1;display:block}
.ring span{font-size:12px;color:var(--hero-fg2);font-weight:600}

/* alerts, rows */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0;padding-top:0}
.alert .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--gold-soft);color:var(--gold)}
.alert.bad .ai{background:var(--bad-soft);color:var(--bad)}
.alert .t{font-weight:650}
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;padding:9px 0;align-items:start}
.tl-row .tm{color:var(--ink-3);font-size:13px;font-weight:600;padding-top:9px}
.evc{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:4px solid var(--c);width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}
.evc b{display:block;font-weight:650;line-height:1.3}
.evc.clash{outline:2px solid var(--bad);outline-offset:-2px}
.free{padding:8px 12px;border-radius:12px;border:1.5px dashed var(--line);color:var(--ink-2);font-size:13px}
.nowrow{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;color:var(--bad);font-weight:700;font-size:12px}
.nowrow i{height:2px;background:var(--bad);border-radius:2px;display:block}
.dl{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dl:first-child{border-top:0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wkd{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.wkd:hover{border-color:var(--accent)}
.wkd.now{border-color:var(--accent);background:var(--accent-soft)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* calendar */
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr));min-width:var(--minw,0)}
.cal .hd{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);font-weight:650;font-size:13px;color:var(--ink-2);background:var(--surface)}
.cal .hd.now{color:var(--accent-ink)} .cal .hd.now b{background:var(--accent);color:var(--on-accent)}
.cal .hd b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--ink)}
.cal .gut{position:relative;border-right:1px solid var(--line)}
.cal .gut span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--ink-3);font-weight:600}
.cal .col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px)}
.cal .col.now{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.cal .ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 7px;font-size:12px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:0;border-left:3px solid var(--c);text-align:left;color:var(--ink)}
.cal .ev b{display:block;font-weight:650}
.cal .ev.clash{outline:2px solid var(--bad);outline-offset:-1px;z-index:2}
.cal .ev.sug{border-left-style:dashed;opacity:.8}
.cal .nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.cal .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2);font-weight:600}
.daystrip button b{font-size:16px;color:var(--ink)}
.daystrip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.daystrip button[aria-pressed="true"] b{color:var(--on-accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* tasks */
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink-3);background:none;display:grid;place-items:center;padding:0;color:transparent}
.cb[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.tt{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink-2);margin-top:3px;align-items:center}
.prio{width:4px;align-self:stretch;border-radius:4px}
.gprog{display:flex;flex-direction:column;gap:8px}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* scheduler */
.sug{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.sug:first-child{border-top:0}
.sug .slot{font-family:var(--font-d);font-weight:700;font-size:20px;line-height:1.1}
.sug .slot small{display:block;font-family:var(--font-b);font-weight:500;font-size:12px;color:var(--ink-3);margin-top:3px}
.daylbl{font-family:var(--font-d);font-weight:650;font-size:15px;color:var(--ink-2);margin:18px 0 2px}
.daylbl:first-child{margin-top:0}
.editrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;padding:12px;border-radius:12px;background:var(--surface-2)}

/* discover */
.opp{display:flex;flex-direction:column;gap:14px}
.opp .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.fit{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:74px}
.fit b{font-family:var(--font-d);font-size:26px;line-height:1}
.fit .meter{width:74px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600} .kv dd{margin:0}
.why{padding:12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.banner{display:flex;gap:12px;padding:12px 16px;border-radius:14px;background:var(--gold-soft);color:var(--ink);font-size:13.5px;align-items:flex-start}
.banner svg{color:var(--gold);margin-top:2px}
a.lnk{color:var(--accent-ink);font-weight:650;text-decoration:underline;text-underline-offset:3px}

/* insights */
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:end;position:relative;padding-top:8px}
.cbar{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.cstack{width:100%;max-width:56px;height:210px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column-reverse;background:var(--surface-2)}
.cstack i{display:block;width:100%}
.capline{position:absolute;left:0;right:0;z-index:2;border-top:2px dashed var(--bad);pointer-events:none}
.capline span{position:absolute;right:0;top:-20px;font-size:11px;font-weight:700;color:var(--bad);background:var(--surface);padding:0 4px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-d);font-size:30px;line-height:1.1}
.habit{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.hdots{display:flex;gap:5px;flex-wrap:wrap}
.hdots button{width:22px;height:22px;border-radius:7px;border:0;background:var(--surface-2);padding:0}
.hdots button[aria-pressed="true"]{background:var(--accent)}
.hdots button.td{outline:2px solid var(--ink-3);outline-offset:1px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.55);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.modal{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:16px}
.modal.wide{width:min(720px,100%)}
.modal header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
textarea.in{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.switch{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--ink-3);padding:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}

/* ---------- schedule engine ---------- */
function occ(date){
  const out=[];
  for(const e of S.events){
    if(e.date===date||(e.rec==='weekly'&&date>=e.date&&dow(date)===dow(e.date)&&!(e.skip||[]).includes(date)))out.push({...e,date});
  }
  for(const d of derivedFor(date))out.push(d);
  return out.sort((a,b)=>mins(a.start)-mins(b.start)||mins(a.end)-mins(b.end));
}
function clashPairs(date){
  const ev=occ(date).filter(e=>e.type!=='rest'&&e.type!=='deadline'),out=[];
  for(let i=0;i<ev.length;i++)for(let j=i+1;j<ev.length;j++)if(mins(ev[j].start)<mins(ev[i].end)&&mins(ev[i].start)<mins(ev[j].end))out.push([ev[i],ev[j]]);
  return out;
}
const loadH=d=>occ(d).filter(e=>BUSY.includes(e.type)).reduce((a,e)=>a+(mins(e.end)-mins(e.start))/60,0);
const winH=()=>(mins(S.profile.availEnd)-mins(S.profile.availStart))/60;
function freeIntervals(date,extra){
  const p=S.profile,w0=mins(p.availStart),w1=mins(p.availEnd),b=+p.buffer;
  const busy=occ(date).filter(e=>e.type!=='rest'&&e.type!=='deadline').map(e=>[mins(e.start)-b,mins(e.end)+b])
    .concat(extra.map(x=>[x[0]-b,x[1]+b])).sort((a,c)=>a[0]-c[0]);
  const out=[];let cur=w0;
  for(const [s,e] of busy){if(s>cur)out.push([cur,Math.min(s,w1)]);cur=Math.max(cur,e);if(cur>=w1)break}
  if(cur<w1)out.push([cur,w1]);
  return out.filter(x=>x[1]-x[0]>=30);
}
const overlap=(a0,a1,b0,b1)=>Math.max(0,Math.min(a1,b1)-Math.max(a0,b0));
const cmpTask=(a,b)=>((a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:b.prio-a.prio);
function remainMin(t){return Math.max(0,Math.round(t.est*((S.learn.estMult||{})[t.subject]||1)*60-(t.sched||0)))}
function generatePlan(){
  const p=S.profile,t0=today(),len=+p.sessionLen,planned={},res=[],unplaced=[];
  const pk=PEAK[p.peak]||PEAK.morning;
  for(const t of S.tasks.filter(x=>!x.done).sort(cmpTask)){
    let remain=remainMin(t);if(remain<30)continue;
    const last=t.due&&t.due>=t0?t.due:addDays(t0,1),days=[];
    for(let d=t0;d<=last&&days.length<14;d=addDays(d,1))days.push(d);
    const used=new Set();let guard=0;
    while(remain>=30&&guard++<14){
      const chunk=Math.min(len,remain);let best=null;
      for(const d of days){
        const pl=planned[d]||[];
        const load=loadH(d)+pl.reduce((a,x)=>a+(x[1]-x[0])/60,0);
        if(load+chunk/60>p.cap)continue;
        for(const [a,b] of freeIntervals(d,pl)){
          for(let s=Math.ceil(a/30)*30;s+chunk<=b;s+=30){
            if(d===t0&&s<nowM()+15)continue;
            const ov=overlap(s,s+chunk,pk[0],pk[1])/chunk;
            let sc=(t.prio>=3?42:22)*ov+14-Math.min(14,between(t0,d)*2.2)-load*1.6-(used.has(d)?16:0)-(s>=1260?10:0)-(s<510?4:0);
            if(!best||sc>best.sc)best={sc,d,s,load,ov};
          }
        }
      }
      if(!best)break;
      (planned[best.d]=planned[best.d]||[]).push([best.s,best.s+chunk]);used.add(best.d);remain-=chunk;
      const bits=[];
      if(best.ov>=.5)bits.push(`Inside your ${p.peak} focus window`);
      bits.push(`day load ${hrs(best.load+chunk/60)} of ${p.cap}h`);
      if(t.due)bits.push(`due ${fd(t.due)}`);
      res.push({id:uid(),taskId:t.id,title:t.title,date:best.d,start:hm(best.s),end:hm(best.s+chunk),reason:bits.join('. ')+'.'});
    }
    if(remain>=30)unplaced.push({title:t.title,left:remain,due:t.due});
  }
  res.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:mins(a.start)-mins(b.start));
  S.sugs=res;S.unplaced=unplaced;save();
}
function acceptSug(id,over){
  const i=S.sugs.findIndex(s=>s.id===id);if(i<0)return false;
  const s={...S.sugs[i],...(over||{})};
  const t=S.tasks.find(x=>x.id===s.taskId);
  const clash=occ(s.date).some(e=>e.type!=='rest'&&e.type!=='deadline'&&mins(e.start)<mins(s.end)&&mins(s.start)<mins(e.end));
  S.events.push({id:'e'+uid(),title:'Study: '+s.title,type:'study',date:s.date,start:s.start,end:s.end,taskId:s.taskId});
  if(t)t.sched=(t.sched||0)+(mins(s.end)-mins(s.start));
  S.sugs.splice(i,1);save();
  return clash;
}
function atRisk(t){
  if(t.done||!t.due)return false;
  const t0=today();if(t.due<t0)return true;
  const rem=remainMin(t)/60;if(rem<=0)return false;
  let free=0;for(let d=t0;d<=t.due;d=addDays(d,1))free+=Math.max(0,Math.min(S.profile.cap-loadH(d),winH()-loadH(d)));
  return rem>free*.5;
}
function alerts(){
  const t0=today(),out=[];
  for(let i=0;S.notif.clashes&&i<14;i++){const d=addDays(t0,i);for(const [a,b] of clashPairs(d))out.push({k:'clash',tone:'bad',title:`Clash on ${rel(d)==='Today'||rel(d)==='Tomorrow'?rel(d):fd(d)}`,detail:`${a.title} (${a.start}) overlaps ${b.title} (${b.start}).`,act:'calDay',arg:d,label:'See it'})}
  for(let i=0;i<7;i++){const d=addDays(t0,i),h=loadH(d);if(h>S.profile.cap)out.push({k:'load',tone:'warn',title:`${fd(d)} is overloaded`,detail:`${hrs(h)} planned, above your ${S.profile.cap}h limit.`,act:'calDay',arg:d,label:'Review'})}
  for(const t of S.tasks.filter(x=>!x.done).sort(cmpTask)){
    if(t.due&&t.due<t0)out.push({k:'overdue',tone:'bad',title:`Overdue: ${t.title}`,detail:`Was due ${fd(t.due)}.`,act:'nav',arg:'plan',label:'Reschedule'});
    else if(atRisk(t))out.push({k:'risk',tone:'warn',title:`At risk: ${t.title}`,detail:`${hrs(remainMin(t)/60)} of work left, due ${rel(t.due).toLowerCase()}. Free time before then is tight.`,act:'nav',arg:'plan',label:'Plan it'});
  }
  return out;
}
function score(al){
  const c=al.filter(a=>a.k==='clash').length,l=al.filter(a=>a.k==='load').length,r=al.filter(a=>a.k==='risk'||a.k==='overdue').length;
  const h=S.habits.filter(x=>x.log[today()]).length;
  return Math.max(8,Math.min(100,100-c*10-l*8-r*9+Math.min(6,h*2)));
}
function nextUp(){
  const t0=today();
  for(let i=0;i<14;i++){const d=addDays(t0,i);for(const e of occ(d)){if(e.type==='rest')continue;if(i===0&&mins(e.end)<=nowM())continue;return e}}
  return null;
}
function untilText(e){
  const t0=today(),a=between(t0,e.date)*1440+mins(e.start)-nowM(),b=between(t0,e.date)*1440+mins(e.end)-nowM();
  if(a<=0)return `Happening now, ends in ${dur(Math.max(1,b))}`;
  if(a<1440)return `Starts in ${dur(a)}`;
  return `${rel(e.date)} at ${e.start}`;
}

function fitOf(o){
  const mine=S.profile.skills.map(s=>s.toLowerCase()),has=s=>mine.some(m=>m===s.toLowerCase());
  const matched=o.skills.filter(has),missing=o.skills.filter(s=>!has(s));
  const gro=S.profile.growth.map(s=>s.toLowerCase()),helps=o.grow.filter(g=>gro.includes(g.toLowerCase()));
  const interest=S.profile.interests.some(i=>{const l=i.toLowerCase();return (o.cat==='hackathon'&&l.includes('hack'))||o.title.toLowerCase().includes(l)||o.skills.some(s=>s.toLowerCase()===l)});
  let sc=34+(o.skills.length?40*matched.length/o.skills.length:20)+(helps.length?Math.min(14,helps.length*6):0)+(interest?10:0);
  const missingHard=missing.length>=2&&matched.length===0;if(missingHard)sc-=8;
  if(o.hrs&&o.hrs>6){const free=winH()*5-[0,1,2,3,4].reduce((a,i)=>a+loadH(addDays(monday(today()),i)),0);if(o.hrs>free*.35)sc-=14}
  return {pct:Math.max(8,Math.min(97,Math.round(sc))),matched,missing,helps};
}

function clashIds(d){const s=new Set();for(const [a,b] of clashPairs(d)){s.add(a.id);s.add(b.id)}return s}
function dayBreak(d){let study=0,work=0;for(const e of occ(d)){const h=(mins(e.end)-mins(e.start))/60;if(['class','exam','study'].includes(e.type))study+=h;else if(['job','hackathon','community'].includes(e.type))work+=h}return {study,work,free:Math.max(0,winH()-study-work)}}

function makeSteps(kind,goal,due){
  const t0=today(),span=Math.max(2,between(t0,due));
  for(const [s,f,h] of TEMPL[kind])S.tasks.push({id:'t'+uid(),title:s,subject:goal,group:goal,due:addDays(t0,Math.floor(span*f)),est:h,prio:kind==='hackathon'?3:2,done:false,sched:0});
  save();
}

   <section class="card" style="display:flex;flex-direction:column;gap:18px"><header style="margin:0"><h2>Balance</h2><span class="pill ${risk[1]}">Burnout risk: ${risk[0]}</span></header>

  +`<section class="card"><header><h2>Daily habits</h2><form data-form="habitAdd" class="row"><input class="in" id="hb-name" name="name" placeholder="New habit" aria-label="New habit name" style="width:170px" required><button class="btn sm">${ico('plus',16)}Add</button></form></header>`
  +S.habits.map(h=>{const st=streak(h);return `<div class="habit"><div><b>${esc(h.name)}</b><div class="sm ${st?'':'faint'}" style="${st?'color:var(--gold);font-weight:700':''}">${st?`${st}-day streak`:'No streak yet'}</div></div><div class="hdots" role="group" aria-label="${esc(h.name)}, last 14 days">${Array.from({length:14},(_,i)=>{const d=addDays(t0,i-13);return `<button class="${d===t0?'td':''}" aria-pressed="${!!h.log[d]}" aria-label="${fd(d)}" title="${fd(d)}" data-act="habitToggle" data-arg="${h.id}" data-date="${d}"></button>`}).join('')}</div><button class="btn sm ghost icon-btn" style="width:34px;height:34px" aria-label="Delete habit" data-act="habitDel" data-arg="${h.id}">${ico('trash',16)}</button></div>`}).join('')

function streak(h){let d=today(),n=0;if(!h.log[d])d=addDays(d,-1);while(h.log[d]){n++;d=addDays(d,-1)}return n}

function evModal(id,date){
  const e=occ(date).find(x=>x.id===id);if(!e)return;
  const cl=clashPairs(date).filter(([a,b])=>a.id===id||b.id===id).map(([a,b])=>a.id===id?b:a);
  modal(`${mh(esc(e.title),`${TYPES[e.type].l} · ${fd(date)} · ${e.start} to ${e.end}`)}
   ${e.loc?`<div class="row">${ico('pin',18)}<span>${esc(e.loc)}</span></div>`:''}
   ${e.rec?`<div class="row">${ico('repeat',18)}<span>Repeats every week</span></div>`:''}
   ${cl.length?`<div class="banner" style="background:var(--bad-soft)"><span style="color:var(--bad)">${ico('warn',20)}</span><div><b>Clashes with</b> ${cl.map(c=>esc(c.title)+' ('+c.start+' to '+c.end+')').join(', ')}. Edit the time or remove one.</div></div>`:''}
   <div class="row" style="justify-content:flex-end">${e.rec?`<button class="btn bad" data-act="evSkip" data-arg="${id}" data-date="${date}">Remove this day only</button>`:''}<button class="btn bad" data-act="evDel" data-arg="${id}">${e.rec?'Remove all repeats':'Remove'}</button><button class="btn pri" data-act="evEdit" data-arg="${id}">Edit</button></div>`);

function icsText(from,to){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AuraStudent//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:AuraStudent'],stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const q=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'),dt=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  for(let d=from;d<=to;d=addDays(d,1))for(const e of occ(d)){
    L.push('BEGIN:VEVENT',`UID:${e.id}-${d}@aurastudent`,`DTSTAMP:${stamp}`,`DTSTART:${dt(d,e.start)}`,`DTEND:${dt(d,e.end)}`,`SUMMARY:${q(e.title)}`);
    if(e.loc)L.push(`LOCATION:${q(e.loc)}`);
    L.push(`CATEGORIES:${TYPES[e.type].l.toUpperCase()}`,`TRANSP:${BUSY.includes(e.type)?'OPAQUE':'TRANSPARENT'}`,'BEGIN:VALARM',`TRIGGER:-PT${+S.notif.eventLead||15}M`,'ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT');
  }
  for(const e of entries()){if(!e.date||e.time||e.done||e.dis||e.rsvp==='no'||e.date<from||e.date>to)continue;L.push('BEGIN:VEVENT',`UID:${e.k}${e.id}@aurastudent`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${e.date.replace(/-/g,'')}`,`SUMMARY:${q(e.title+(e.status==='verify'?' (date unverified)':''))}`,'TRANSP:TRANSPARENT','BEGIN:VALARM',e.remind==='1d'?'TRIGGER:-PT15H':'TRIGGER:PT9H','ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT')}
  L.push('END:VCALENDAR');return L.join('\r\n');
}

  best=best||{d:t0,s:1080};
  modal(`${mh('Propose a study room',`With ${esc(who)}`)}<form data-form="roomSave" data-who="${esc(who)}" class="fgrid">

  const a=rows[0],b=rows[1];
  let t=`**Start with ${a.sub}.** `;
  if(b)t+=`Putting it first protects the nearest pressure. Delaying **${b.sub}** costs ${b.near===null&&b.ex===null?'little, since nothing is due soon':'some slack, since its pressure comes later'}.`;

}

function conflictsAnswer(){
  const t0=today(),al=alerts(),props=[],notes=[];
  if(!al.length)return RR('No clashes, overloaded days or at-risk deadlines in the next two weeks. I will keep checking as you add things.',[],['Your calendar for 14 days','Open tasks and estimates']);
  const lines=al.slice(0,6).map(a=>`- **${a.title}.** ${a.detail}`);
  for(let i=0;i<10&&props.length<4;i++){
    const d=addDays(t0,i);
    for(const [a,b] of clashPairs(d)){
      const mv=[a,b].find(e=>!e.rec&&!e.ro&&!['class','exam','job'].includes(e.type)),fixed=mv===a?b:a;
      if(!mv){notes.push(`${a.title} and ${b.title} are both fixed, so only you can resolve it (for example by asking to swap a shift). I cannot contact anyone.`);continue}
      const len=mins(mv.end)-mins(mv.start);let placed=null;
      for(let j=0;j<4&&!placed;j++){const dd=addDays(d,j);const itv=freeIntervals(dd,[]).find(x=>x[1]-x[0]>=len&&(j>0||x[1]-len>=mins(fixed.end)));if(itv){const st=j===0?Math.max(itv[0],mins(fixed.end)+ +S.profile.buffer):itv[0];if(st+len<=itv[1])placed={dd,st}}}
      if(placed)props.push({kind:'move',eventId:mv.id,date:mv.date,newDate:placed.dd,start:hm(placed.st),end:hm(placed.st+len),why:`Clears the clash with ${fixed.title}. Tradeoff: ${placed.dd===d?'same day, so the day stays busy':'a different day, so tell anyone it affects'}.`});
    }
  }
  for(const a of al.filter(x=>x.k==='load').slice(0,1)){
    const mv=occ(a.arg).find(e=>!e.rec&&e.type==='study');if(!mv)continue;
    const len=mins(mv.end)-mins(mv.start);let best=null;
    for(let i=0;i<7;i++){const dd=addDays(t0,i);if(dd===a.arg||loadH(dd)+len/60>S.profile.cap)continue;const st=findSlot(dd,len,[]);if(st!==null&&(!best||loadH(dd)<best.l))best={dd,st,l:loadH(dd)}}
    if(best)props.push({kind:'move',eventId:mv.id,date:mv.date,newDate:best.dd,start:hm(best.st),end:hm(best.st+len),why:`Takes load off ${fd(a.arg)}. Tradeoff: it lands on ${fd(best.dd)}, your lightest day with room.`});
  }
  for(const a of al.filter(x=>x.k==='risk'||x.k==='overdue').slice(0,2))notes.push(`For "${a.title.replace(/^(At risk|Overdue): /,'')}", book blocks in Smart plan, or settle for a shorter pass that covers the essentials in 60 minutes. That saves time but may lower quality.`);
  return RR(`**What I found:**\n${lines.join('\n')}${notes.length?'\n\n'+notes.map(n=>'- '+n).join('\n'):''}${props.length?'\n\nReview the proposed moves below before applying them.':''}`,props,['Your calendar for 14 days','Open tasks and estimates','Your daily limit'],['Hours left per task are estimates']);
}

const STOP=new Set('the and for with that this from are was were been have has had its into than then they which their there these those can will not but also about when what your you our out over such more most each other any all one two may who how why only some very much many same'.split(' '));
function localNotes(text,subject){
  const flat=text.replace(/\s+/g,' ').trim(),sents=(flat.match(/[^.!?]+[.!?]/g)||[flat]).map(s=>s.trim()).filter(s=>s.length>35&&s.length<260);
  const freq={};(flat.toLowerCase().match(/[a-z][a-z-]{3,}/g)||[]).forEach(w=>{if(!STOP.has(w))freq[w]=(freq[w]||0)+1});
  const scored=sents.map((s,i)=>({s,i,sc:((s.toLowerCase().match(/[a-z][a-z-]{3,}/g)||[]).reduce((a,w)=>a+(freq[w]||0),0))/Math.sqrt(s.length)})).sort((a,b)=>b.sc-a.sc);
  const summary=scored.slice(0,6).sort((a,b)=>a.i-b.i).map(x=>x.s);
  const terms=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>({term:x[0],meaning:''}));
  const questions=[];
  for(const x of scored.slice(0,8)){
    const ws=(x.s.match(/[A-Za-z][A-Za-z-]{4,}/g)||[]).filter(w=>!STOP.has(w.toLowerCase())).sort((a,b)=>(freq[b.toLowerCase()]||0)-(freq[a.toLowerCase()]||0));
    if(!ws.length)continue;const w=ws[0];
    questions.push({q:'Fill the gap: '+x.s.replace(new RegExp('\\b'+w+'\\b'),'_____'),a:w+'. From your notes: "'+x.s+'"',st:''});
    if(questions.length>=6)break;
  }
  const n=questions.length||1;
  return {summary,terms,questions,tasks:[{title:`Review notes: ${subject}`,estHours:.5,dueInDays:1},{title:`Answer ${n} practice ${n===1?'question':'questions'} from memory (${subject})`,estHours:.75,dueInDays:3},{title:`Second pass on weak points (${subject})`,estHours:.5,dueInDays:7}],source:'local'};
}
async function genNotes(text,subject){
  const sm=await getSample();
  if(sm){
    try{
      const r=await sm.json(`You help a student revise. Use ONLY the notes below and do not add facts that are not in them. Reply with ONLY one JSON object: {"summary":[5 to 8 short bullet strings],"keyTerms":[{"term":string,"meaning":string}] (up to 8),"questions":[{"q":string,"a":string}] (6 to 8, mixing recall and "explain why"),"tasks":[{"title":string,"estHours":number,"dueInDays":integer from 1 to 10}] (2 to 4 review tasks; hours are estimates)}.\nSubject: ${subject}\nNOTES:\n${text.slice(0,12000)}`,{cache:false});
      if(!r||!Array.isArray(r.summary)||!Array.isArray(r.questions))throw {code:'invalid_json'};
      return {summary:r.summary.map(String).slice(0,10),terms:(r.keyTerms||[]).slice(0,8).map(x=>({term:String(x.term),meaning:String(x.meaning||'')})),questions:r.questions.slice(0,10).map(x=>({q:String(x.q),a:String(x.a),st:''})),tasks:(r.tasks||[]).slice(0,4).map(t=>({title:String(t.title).slice(0,90),estHours:Math.min(8,Math.max(.25,+t.estHours||.5)),dueInDays:Math.min(14,Math.max(1,Math.round(+t.dueInDays)||3))})),source:'claude'};
    }catch(e){const r=localNotes(text,subject);r.note=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)?'Claude is not available here, so the built-in summariser was used.':'Claude could not finish ('+(e.code||'error')+'), so the built-in summariser was used.';return r}
  }
  return localNotes(text,subject);
}

function logAuto(text,undo){S.auto.log.unshift({id:uid(),ts:Date.now(),text,undo});S.auto.log=S.auto.log.slice(0,40)}
function relocate(ev,fromDate,notBefore){
  const len=mins(ev.end)-mins(ev.start),t0=today();
  for(let j=0;j<4;j++){
    const dd=addDays(fromDate,j);if(dd<t0)continue;
    const itv=freeIntervals(dd,[]).find(x=>x[1]-x[0]>=len&&(dd!==t0||x[1]-len>nowM()+15));if(!itv)continue;
    let st=itv[0];if(dd===t0)st=Math.max(st,Math.ceil((nowM()+15)/15)*15);if(j===0&&notBefore!=null)st=Math.max(st,notBefore);
    if(st+len<=itv[1])return {dd,st,len};
  }
  return null;
}
function autopilotRun(){
  const lvl=S.auto.level;if(lvl==='ask')return 0;
  const t0=today(),mover=e=>!e.rec&&!S.auto.noMove.includes(e.id)&&(e.by==='aura'||e.type==='study');let n=0;
  for(let i=0;i<7&&n<6;i++){
    const d=addDays(t0,i);
    for(const [a,b] of clashPairs(d)){
      const mv=[a,b].find(mover);if(!mv)continue;const fixed=mv===a?b:a;
      const p=relocate(mv,d,mins(fixed.end)+ +S.profile.buffer),ev=S.events.find(x=>x.id===mv.id);if(!p||!ev)continue;
      logAuto(`Moved "${ev.title}" from ${fd(ev.date)} ${ev.start} to ${fd(p.dd)} ${hm(p.st)}, clear of ${fixed.title}.`,{t:'move',id:ev.id,date:ev.date,start:ev.start,end:ev.end});
      ev.date=p.dd;ev.start=hm(p.st);ev.end=hm(p.st+p.len);n++;break;
    }
  }
  for(let i=0;i<5&&n<6;i++){
    const d=addDays(t0,i);if(loadH(d)<=S.profile.cap)continue;
    const mv=occ(d).filter(mover).sort((a,b)=>mins(b.start)-mins(a.start))[0];if(!mv)continue;
    const len=mins(mv.end)-mins(mv.start);let best=null;
    for(let j=0;j<7;j++){const dd=addDays(t0,j);if(dd===d||loadH(dd)+len/60>S.profile.cap)continue;const st=findSlot(dd,len,[]);if(st!==null&&(!best||loadH(dd)<best.l))best={dd,st,l:loadH(dd)}}
    const ev=S.events.find(x=>x.id===mv.id);if(!best||!ev)continue;
    logAuto(`Moved "${ev.title}" off ${fd(d)}, which was over your ${S.profile.cap}h limit, to ${fd(best.dd)} ${hm(best.st)}.`,{t:'move',id:ev.id,date:ev.date,start:ev.start,end:ev.end});
    ev.date=best.dd;ev.start=hm(best.st);ev.end=hm(best.st+len);n++;
  }
  if(lvl==='auto'){
    generatePlan();
    for(const sg of [...S.sugs]){
      if(n>=6)break;if(sg.date>addDays(t0,2)||S.auto.skip.includes(sg.taskId+':'+sg.date))continue;
      const t=S.tasks.find(x=>x.id===sg.taskId);if(!t)continue;
      const id='e'+uid(),m=mins(sg.end)-mins(sg.start);
      S.events.push({id,title:'Study: '+sg.title,type:'study',date:sg.date,start:sg.start,end:sg.end,taskId:sg.taskId,by:'aura'});
      t.sched=(t.sched||0)+m;S.sugs=S.sugs.filter(x=>x.id!==sg.id);
      logAuto(`Booked "${sg.title}" on ${fd(sg.date)}, ${sg.start} to ${sg.end}. ${sg.reason}`,{t:'del',id,taskId:sg.taskId,mins:m,date:sg.date});n++;
    }
  }
  S.auto.pending=validateProps(conflictsAnswer().proposals.filter(p=>p.kind==='move')).filter(p=>!S.auto.skipPend.includes(p.eventId+':'+p.newDate+':'+p.start));
  save();return n;
}

  for(const h of S.hacks)for(const m of h.milestones){if(!m.enabled)continue;out.push({k:'m',id:m.id,ref:m,hack:h,title:`${h.title}: ${m.label}`,date:m.date||null,time:m.time||'',dur:m.key==='start'?120:30,status:m.dateStatus,link:m.link,note:m.note,done:!!m.done,dis:false,snooze:m.snooze,remind:m.remind||'1d',type:m.key==='start'?'hackathon':'deadline'})}
  for(const c of S.comms){if(!c.renewal)continue;out.push({k:'c',id:c.id,ref:c,title:`${c.name}: membership renewal`,date:c.renewal,time:'',dur:30,status:c.renewStatus,link:c.renewLink,note:c.renewNote,done:!!c.renewDone,dis:false,snooze:c.snooze,remind:c.remind||'1d',type:'deadline'})}
  return out;
}
const findE=a=>{const i=a.indexOf(':');const k=a.slice(0,i),id=a.slice(i+1);return entries().find(e=>e.k===k&&e.id===id)};
const eKey=e=>e.k+':'+e.id;
function derivedFor(date){

function clashesAt(date,s,e,ex){if(!date||!s||!e||mins(e)<=mins(s))return[];return occ(date).filter(x=>x.type!=='rest'&&x.type!=='deadline'&&x.id!==ex&&mins(x.start)<mins(e)&&mins(s)<mins(x.end))}

/* ---------- Today: Needs attention ---------- */
function attention(){
  const t0=today(),out=[],sn=S.att.snooze,days=d=>between(t0,d);
  for(const e of entries()){
    if(e.done||e.dis||(e.snooze&&e.snooze>t0))continue;
    if(e.k==='i'&&e.ref.cat==='event'&&e.date&&e.date<t0)continue;
    let u=0;const why=[];
    if(e.date){
      const n=days(e.date);
      if(n<0){u=100;why.push(`Date passed ${-n} ${-n===1?'day':'days'} ago and it is not marked done`)}
      else if(n<=3&&e.status==='confirmed'){u=90-n*5;why.push(n===0?'Today'+(e.time?' at '+e.time:''):`In ${n} ${n===1?'day':'days'}`)}
      if(e.status==='verify'){
        why.push(`Date not confirmed${n>=0&&n<=7?(n===0?', and it is today':n===1?', and it is tomorrow':`, and it is in ${n} days`):''}`);
        if(!srcText(e))why.push('No source saved');
        u=Math.max(u,n>=0&&n<=7?86-n:45);
      }
    }else{why.push('No date yet'+(srcText(e)?'':' and no source saved'));u=35}
    if(why.length)out.push({key:'e:'+eKey(e),u,kind:'date',e,why:why.join('. ')+'.'});
    if(e.k==='i'&&e.ref.next&&!e.ref.nextDone&&e.ref.nextDue&&e.ref.nextDue<=t0){
      const n=days(e.ref.nextDue);
      out.push({key:'n:'+e.id,u:n<0?96:84,kind:'next',e,why:`Next action ${n<0?`overdue by ${-n} ${-n===1?'day':'days'}`:'due today'}: ${e.ref.next}`});
    }
  }
  for(const a of alerts()){
    let u;
    if(a.k==='clash'){const n=days(a.arg);if(n>2)continue;u=n<=0?88:80}
    else u=a.k==='overdue'?92:a.k==='risk'?60:55;
    const key='a:'+a.k+a.title+a.detail;if(sn[key]&&sn[key]>t0)continue;
    out.push({key,u,kind:'alert',a,why:a.detail});
  }
  return out.sort((a,b)=>b.u-a.u);
}

function entryRems(){
  const t0=today(),n=nowM();
  for(const e of entries()){
    if(!e.date||e.done||e.dis||e.remind==='none'||e.rsvp==='no'||(e.snooze&&e.snooze>t0))continue;
    const dd=between(t0,e.date);if(dd<0)continue;
    const lead={'15m':15,'1h':60}[e.remind];let tgt;
    if(lead&&e.time)tgt=dd*1440+mins(e.time)-lead;else tgt=(dd-(e.remind==='1d'?1:0))*1440+480;
    const end=dd*1440+(e.time?mins(e.time)+e.dur:1440);
    if(tgt<=n&&n<end)fireRem(`en:${eKey(e)}:${e.date}:${e.remind}`,e.title+(e.status==='verify'?' (date not confirmed)':''),`${rel(e.date)}${e.time?' at '+e.time:''}${e.status==='verify'?'. Check this date at its source.':''}`);
  }
  if(n>=480)for(const i of S.items){if(i.next&&!i.nextDone&&!i.done&&!i.dismissed&&i.nextDue&&i.nextDue<=t0&&i.nextDue>=addDays(t0,-3))fireRem(`na:${i.id}:${i.nextDue}`,`Next action: ${i.next}`,`For ${i.title}. ${i.nextDue<t0?'Overdue.':'Due today.'}`)}
}

const BDRE=/^\d{4}-\d{2}-\d{2}$/,BTRE=/^([01]\d|2[0-3]):[0-5]\d$/;
const COLS=[['events','Calendar events'],['tasks','Tasks'],['habits','Habits'],['items','Captured items'],['hacks','Hackathons'],['comms','Communities'],['templates','Study templates']];
function exportObj(){const d=JSON.parse(JSON.stringify(S));delete d.fired;delete d.ntfy;delete d.account;return {app:'AuraStudent',schema:1,exportedAt:new Date().toISOString(),data:d}}
function validateBackup(raw){
  const errs=[];let o;
  try{o=JSON.parse(raw)}catch(e){return {errs:['This is not valid JSON. The file may be damaged or is not an AuraStudent backup.']}}
  if(!o||typeof o!=='object'||o.app!=='AuraStudent')return {errs:['This file is not an AuraStudent backup. The "app" marker is missing.']};
  if(typeof o.schema!=='number'||o.schema<1||o.schema>1)return {errs:[`Unsupported backup version ${o.schema}. This app reads version 1.`]};
  const d=o.data;if(!d||typeof d!=='object'||Array.isArray(d))return {errs:['The backup has no "data" section.']};
  const list=(k,chk)=>{if(d[k]===undefined)return;if(!Array.isArray(d[k])){errs.push(`"${k}" must be a list.`);return}d[k].forEach((r,i)=>{const w=`${k} #${i+1}`;if(!r||typeof r!=='object'||Array.isArray(r)){errs.push(`${w}: not a record.`);return}if(typeof r.id!=='string'||!r.id){errs.push(`${w}: missing id.`);return}chk(r,w)})};
  const isStr=v=>typeof v==='string'&&v.trim().length>0,dOK=v=>v==null||v===''||(typeof v==='string'&&BDRE.test(v)),tOK=v=>v==null||v===''||(typeof v==='string'&&BTRE.test(v));
  list('events',(r,w)=>{if(!isStr(r.title))errs.push(`${w}: missing title.`);if(!BDRE.test(r.date||''))errs.push(`${w}: bad date.`);if(!BTRE.test(r.start||'')||!BTRE.test(r.end||''))errs.push(`${w}: bad start or end time.`);else if(mins(r.end)<=mins(r.start))errs.push(`${w}: end is not after start.`)});
  list('tasks',(r,w)=>{if(!isStr(r.title))errs.push(`${w}: missing title.`);if(!dOK(r.due))errs.push(`${w}: bad due date.`)});
  list('habits',(r,w)=>{if(!isStr(r.name))errs.push(`${w}: missing name.`)});
  list('items',(r,w)=>{if(!isStr(r.title))errs.push(`${w}: missing title.`);if(!dOK(r.date))errs.push(`${w}: bad date.`);if(!tOK(r.time))errs.push(`${w}: bad time.`)});
  list('hacks',(r,w)=>{if(!isStr(r.title))errs.push(`${w}: missing title.`);if(!Array.isArray(r.milestones))errs.push(`${w}: milestones must be a list.`);else r.milestones.forEach((m,j)=>{if(!m||typeof m.id!=='string'||!isStr(m.label)||!dOK(m.date)||!tOK(m.time))errs.push(`${w}, milestone ${j+1}: invalid.`)})});
  list('comms',(r,w)=>{if(!isStr(r.name))errs.push(`${w}: missing name.`);if(!dOK(r.renewal))errs.push(`${w}: bad renewal date.`)});
  list('templates',(r,w)=>{if(!isStr(r.name)||!isStr(r.title))errs.push(`${w}: missing name or title.`);if(!BTRE.test(r.start||''))errs.push(`${w}: bad start time.`);if(!Array.isArray(r.days)||r.days.some(x=>!Number.isInteger(x)||x<0||x>6))errs.push(`${w}: bad days.`)});
  if(d.profile!==undefined&&(typeof d.profile!=='object'||!d.profile||Array.isArray(d.profile)))errs.push('"profile" must be an object.');
  return {errs,o,d};
}
function applyImport(d,mode){

const NTFY_MAX_H=70,REOPEN_H=46;
const atMs=(date,min)=>{const [y,m,d]=date.split('-').map(Number);return new Date(y,m-1,d,Math.floor(min/60),min%60).getTime()};
const n2=n=>String(n).padStart(2,'0');
const dKey=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${n2(d.getMonth()+1)}-${n2(d.getDate())}`};
const clockT=ms=>{const d=new Date(ms);return `${n2(d.getHours())}:${n2(d.getMinutes())}`};
const whenTxt=ms=>{if(!ms)return 'Never';const k=dKey(ms),r=rel(k);return `${r==='Today'||r==='Tomorrow'||r==='Yesterday'?r:fd(k)} at ${clockT(ms)}`};
const hash36=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};

const detailsOn=()=>S.ntfy.privacy==='details';
function ntfyPlan(){
  const now=Date.now(),t0=today(),out=[],seen=new Set(),horizon=now+NTFY_MAX_H*3600e3,lead=+S.notif.eventLead||15;
  const add=(base,at,title,body)=>{
    if(!(at>now+20000&&at<horizon))return;
    const seq='au'+hash36(base);if(seen.has(seq))return;seen.add(seq);
    const t=detailsOn()?title:GEN_TITLE,m=detailsOn()?body:GEN_MSG;
    out.push({seq,at,title:t,msg:m,sig:hash36(at+'|'+(detailsOn()?'d':'g')+'|'+(detailsOn()?t+'|'+m:''))});
  };
  for(let i=0;i<=4;i++){
    const date=addDays(t0,i);
    if(S.notif.events)for(const e of occ(date)){if(e.ro||e.type==='rest'||e.type==='deadline')continue;add(`ev:${e.id}:${date}`,atMs(date,mins(e.start)-lead),e.title,`Starts at ${e.start}${e.loc?' · '+e.loc:''}`)}
    if(S.notif.deadlines&&S.notif.lead!=='same')for(const e of occ(date))if(!e.ro&&(e.type==='exam'||e.type==='deadline'))add(`x1:${e.id}:${date}`,atMs(addDays(date,-1),480),`Tomorrow: ${e.title}`,`${e.start}${e.loc?' · '+e.loc:''}`);
  }
  if(S.notif.deadlines)for(const t of S.tasks){
    if(t.done||!t.due)continue;
    add(`d0:${t.id}:${t.due}`,atMs(t.due,480),`Due today: ${t.title}`,`${hrs(remainMin(t)/60)} of work still open.`);
    if(S.notif.lead!=='same')add(`d1:${t.id}:${t.due}`,atMs(addDays(t.due,-1),480),`Due tomorrow: ${t.title}`,`${hrs(remainMin(t)/60)} left.`);
  }
  for(const e of entries()){
    if(!e.date||e.done||e.dis||e.remind==='none'||e.rsvp==='no'||(e.snooze&&e.snooze>t0))continue;
    const lead2={'15m':15,'1h':60}[e.remind];let at;
    if(lead2&&e.time)at=atMs(e.date,mins(e.time)-lead2);else at=atMs(addDays(e.date,e.remind==='1d'?-1:0),480);
    add(`en:${eKey(e)}:${e.date}`,at,e.title+(e.status==='verify'?' (date not confirmed)':''),`${e.date===today()?'Today':fd(e.date)}${e.time?' at '+e.time:''}${e.status==='verify'?'. Check this date at its source.':''}`);
  }
  for(const i of S.items)if(i.next&&!i.nextDone&&!i.done&&!i.dismissed&&i.nextDue&&!(i.snooze&&i.snooze>t0))add(`na:${i.id}:${i.nextDue}`,atMs(i.nextDue,480),`Next action: ${i.next}`,`For ${i.title}.`);

    const now=Date.now(),sent=S.ntfy.sent;

/* ================= Google sign-in (identity only, opt-in, loaded only when you press the button) ================= */
const gDecode=t=>{try{let p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');p+='='.repeat((4-p.length%4)%4);return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return null}};
const gIdOK=v=>/^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$/i.test((v||'').trim());
let gLoading=null;
function gLoad(){
  if(window.google&&google.accounts&&google.accounts.id)return Promise.resolve();
  if(gLoading)return gLoading;
  gLoading=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=res;sc.onerror=()=>{gLoading=null;rej(new Error('Could not load Google sign-in. Check your connection.'))};document.head.appendChild(sc)});
  return gLoading;
}
function gCb(resp){
  const p=resp&&resp.credential?gDecode(resp.credential):null;
  if(!p||!p.email||(p.aud&&p.aud!==S.account.clientId)){toast('Google sign-in did not complete. Try again.');return}
  S.account.name=p.name||'';S.account.email=p.email;save();render();toast('Signed in as '+p.email);
}
function acctCard(){
  const a=S.account,on=!!a.email;
  return `<section class="card" aria-labelledby="gs-h"><header><h2 id="gs-h">Google account</h2><span class="pill ${on?'ok':''}">${on?'Signed in':'Signed out'}</span></header>
   <p class="sm muted">Sign-in only shows who you are on this device. Your planner data is not sent to Google or anywhere else, and it does not sync between devices. Google is contacted only when you press the sign-in button.</p>
   ${on?`<div class="setrow"><b>${esc(a.name||'Signed in')}</b><span class="sm">${esc(a.email)}</span></div><div class="row" style="margin-top:10px;flex-wrap:wrap">${a.name&&a.name!==S.profile.name?'<button class="btn" data-act="gUseName">Use my Google name in the app</button>':''}<button class="btn" data-act="gOut">Sign out</button></div>`
   :`<form data-form="gSave" class="fgrid" style="margin-top:10px"><label class="f" style="grid-column:1/-1">Google Client ID<input class="in" id="g-id" name="id" value="${esc(a.clientId)}" placeholder="1234567890-abc.apps.googleusercontent.com" autocomplete="off" spellcheck="false"></label>
    <p class="sm faint" style="grid-column:1/-1">In Google Cloud Console, add <b>${esc(location.origin&&location.origin!=='null'?location.origin:'your app address')}</b> as an authorized JavaScript origin for this Client ID.</p>
    <div id="g-err" class="sm" style="grid-column:1/-1;color:var(--bad);font-weight:600" role="alert"></div>
    <div class="row" style="grid-column:1/-1;flex-wrap:wrap"><button class="btn pri">Sign in with Google</button></div></form><div id="g-btn" style="margin-top:12px"></div>`}</section>`;
}
{const _vp7=VIEWS.profile;VIEWS.profile=()=>_vp7()+acctCard()}
F.gSave=async(d)=>{
  const id=(d.get('id')||'').trim(),err=$('#g-err');
  if(!gIdOK(id)){err.textContent='That does not look like a Google Client ID. It ends with .apps.googleusercontent.com';return}
  S.account.clientId=id;save();err.textContent='Loading Google sign-in...';
  try{
    await gLoad();
    google.accounts.id.initialize({client_id:id,callback:gCb});
    const b=$('#g-btn');if(b)google.accounts.id.renderButton(b,{theme:'outline',size:'large',text:'signin_with'});
    google.accounts.id.prompt();
    err.textContent='Press the Google button above. If it does not appear, check the Client ID and that this address is an authorized origin.';
  }catch(e){err.textContent=(e&&e.message)||'Could not start Google sign-in.'}
};
Object.assign(A,{
 gOut:()=>{try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect()}catch(e){}S.account.name='';S.account.email='';save();render();toast('Signed out')},
 gUseName:()=>{S.profile.name=S.account.name;save();render();toast('Name updated')}
});
