<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3D38">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AuraStudent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>AuraStudent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: left rail on desktop, bottom tab bar on phones. Calendar-first; the dashboard leads with a dark "aura" hero that carries the week-health ring. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface-2:#E8EFEC; --line:#D8E2DE;
  --ink:#10201D; --ink-2:#47595A; --ink-3:#6F8280;
  --accent:#0B8A7B; --accent-ink:#06665B; --accent-soft:#D5F0EA; --on-accent:#FFFFFF;
  --gold:#B96F00; --gold-soft:#FBEACB;
  --bad:#C2362B; --bad-soft:#FBE1DE; --ok:#1B8A4C; --ok-soft:#DBF3E4;
  --c-class:#2F6FDE; --c-exam:#D13C3C; --c-hack:#C77D0A; --c-job:#8A4FD6; --c-study:#0B8A7B;
  --c-comm:#D6479A; --c-pers:#5E6E69; --c-rest:#4F9D3A;
  --hero-a:#0B3D38; --hero-b:#0A2735; --hero-fg:#F2FBF9; --hero-fg2:#A9CFC8;
  --r-ok:#34E0C8; --r-mid:#FFC15E; --r-bad:#FF8A80;
  --shadow:0 1px 2px rgba(16,32,29,.06),0 8px 24px -12px rgba(16,32,29,.18);
  --font-d:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1311; --surface:#121D1A; --surface-2:#1A2824; --line:#25362F;
  --ink:#E8F2EF; --ink-2:#A6BAB4; --ink-3:#7F938D;
  --accent:#2DD4BF; --accent-ink:#5EE6D3; --accent-soft:#12312C; --on-accent:#04201C;
  --gold:#FFB340; --gold-soft:#3A2B0E;
  --bad:#FF7A70; --bad-soft:#3A1816; --ok:#4ADE80; --ok-soft:#12301F;
  --c-class:#6EA2FF; --c-exam:#FF7B7B; --c-hack:#FFB340; --c-job:#B98CFF; --c-study:#2DD4BF;
  --c-comm:#FF8CC6; --c-pers:#9DB0AA; --c-rest:#8FD66E;
  --hero-a:#0F4D45; --hero-b:#0A2230;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1311; --surface:#121D1A; --surface-2:#1A2824; --line:#25362F;
  --ink:#E8F2EF; --ink-2:#A6BAB4; --ink-3:#7F938D;
  --accent:#2DD4BF; --accent-ink:#5EE6D3; --accent-soft:#12312C; --on-accent:#04201C;
  --gold:#FFB340; --gold-soft:#3A2B0E;
  --bad:#FF7A70; --bad-soft:#3A1816; --ok:#4ADE80; --ok-soft:#12301F;
  --c-class:#6EA2FF; --c-exam:#FF7B7B; --c-hack:#FFB340; --c-job:#B98CFF; --c-study:#2DD4BF;
  --c-comm:#FF8CC6; --c-pers:#9DB0AA; --c-rest:#8FD66E;
  --hero-a:#0F4D45; --hero-b:#0A2230;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(26px,4vw,36px);font-weight:700;line-height:1.08}
h2{font-size:19px;font-weight:650}
h3{font-size:16px;font-weight:650}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .sm{font-size:13px}
.ic{flex:none}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;align-self:start;display:flex;flex-direction:column;gap:4px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--ink-2);font-weight:500;text-align:left}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.nav .badge{margin-left:auto}
.fchoices legend{font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:6px;padding:0}.fch{display:flex;flex-wrap:wrap;gap:8px}.fch label{cursor:pointer}.fch input{position:absolute;opacity:0;pointer-events:none}.fch span{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14px}.fch input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}.fch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.moremenu{position:fixed;z-index:60;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px -12px rgba(0,0,0,.45)}
.side .grow{flex:1}
.main{min-width:0;padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mhead{display:none}
.tabbar{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;transition:background .15s,transform .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;height:38px;padding:0}
.in{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-family:var(--font-d);font-size:17px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:13px}
.chip button{border:0;background:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:inherit;padding:0}
.chip button:hover{background:rgba(0,0,0,.1)}
.chip.plain{padding:4px 11px;background:var(--surface-2);color:var(--ink-2)}
.chip.match{padding:4px 11px;background:var(--ok-soft);color:var(--ok)}
.chip.gap{padding:4px 11px;background:var(--gold-soft);color:var(--gold)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px;color:var(--hero-fg);background:radial-gradient(900px 380px at 88% -10%,rgba(52,224,200,.30),transparent 60%),radial-gradient(520px 320px at 0% 120%,rgba(255,193,94,.20),transparent 60%),linear-gradient(135deg,var(--hero-a),var(--hero-b));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(28px,4.6vw,44px);color:var(--hero-fg)}
.hero .sub{color:var(--hero-fg2);margin-top:8px;max-width:52ch}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:var(--hero-fg)}
.hero .btn:hover{background:rgba(255,255,255,.18)}
.hero .btn.pri{background:var(--r-ok);border-color:var(--r-ok);color:#04201C}
.next{margin-top:20px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;gap:14px;align-items:center;max-width:520px}
.next .when{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.1}
.next small{color:var(--hero-fg2);display:block}
.ring{position:relative;width:168px;height:168px;display:grid;place-items:center;text-align:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--font-d);font-size:46px;line-height:1;display:block}
.ring span{font-size:12px;color:var(--hero-fg2);font-weight:600}

/* alerts, rows */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0;padding-top:0}
.alert .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--gold-soft);color:var(--gold)}
.alert.bad .ai{background:var(--bad-soft);color:var(--bad)}
.alert .t{font-weight:650}
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;padding:9px 0;align-items:start}
.tl-row .tm{color:var(--ink-3);font-size:13px;font-weight:600;padding-top:9px}
.evc{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:4px solid var(--c);width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}
.evc b{display:block;font-weight:650;line-height:1.3}
.evc.clash{outline:2px solid var(--bad);outline-offset:-2px}
.free{padding:8px 12px;border-radius:12px;border:1.5px dashed var(--line);color:var(--ink-2);font-size:13px}
.nowrow{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;color:var(--bad);font-weight:700;font-size:12px}
.nowrow i{height:2px;background:var(--bad);border-radius:2px;display:block}
.dl{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dl:first-child{border-top:0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wkd{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.wkd:hover{border-color:var(--accent)}
.wkd.now{border-color:var(--accent);background:var(--accent-soft)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* calendar */
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr));min-width:var(--minw,0)}
.cal .hd{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);font-weight:650;font-size:13px;color:var(--ink-2);background:var(--surface)}
.cal .hd.now{color:var(--accent-ink)} .cal .hd.now b{background:var(--accent);color:var(--on-accent)}
.cal .hd b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--ink)}
.cal .gut{position:relative;border-right:1px solid var(--line)}
.cal .gut span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--ink-3);font-weight:600}
.cal .col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px)}
.cal .col.now{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.cal .ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 7px;font-size:12px;line-height:1.25;overflow:hidden;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:0;border-left:3px solid var(--c);text-align:left;color:var(--ink)}
.cal .ev b{display:block;font-weight:650}
.cal .ev.clash{outline:2px solid var(--bad);outline-offset:-1px;z-index:2}
.cal .ev.sug{border-left-style:dashed;opacity:.8}
.cal .nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.cal .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2);font-weight:600}
.daystrip button b{font-size:16px;color:var(--ink)}
.daystrip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.daystrip button[aria-pressed="true"] b{color:var(--on-accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* tasks */
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink-3);background:none;display:grid;place-items:center;padding:0;color:transparent}
.cb[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.tt{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink-2);margin-top:3px;align-items:center}
.prio{width:4px;align-self:stretch;border-radius:4px}
.gprog{display:flex;flex-direction:column;gap:8px}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* scheduler */
.sug{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.sug:first-child{border-top:0}
.sug .slot{font-family:var(--font-d);font-weight:700;font-size:20px;line-height:1.1}
.sug .slot small{display:block;font-family:var(--font-b);font-weight:500;font-size:12px;color:var(--ink-3);margin-top:3px}
.daylbl{font-family:var(--font-d);font-weight:650;font-size:15px;color:var(--ink-2);margin:18px 0 2px}
.daylbl:first-child{margin-top:0}
.editrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;padding:12px;border-radius:12px;background:var(--surface-2)}

/* discover */
.opp{display:flex;flex-direction:column;gap:14px}
.opp .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.fit{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:74px}
.fit b{font-family:var(--font-d);font-size:26px;line-height:1}
.fit .meter{width:74px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600} .kv dd{margin:0}
.why{padding:12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.banner{display:flex;gap:12px;padding:12px 16px;border-radius:14px;background:var(--gold-soft);color:var(--ink);font-size:13.5px;align-items:flex-start}
.banner svg{color:var(--gold);margin-top:2px}
a.lnk{color:var(--accent-ink);font-weight:650;text-decoration:underline;text-underline-offset:3px}

/* insights */
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:end;position:relative;padding-top:8px}
.cbar{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.cstack{width:100%;max-width:56px;height:210px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column-reverse;background:var(--surface-2)}
.cstack i{display:block;width:100%}
.capline{position:absolute;left:0;right:0;z-index:2;border-top:2px dashed var(--bad);pointer-events:none}
.capline span{position:absolute;right:0;top:-20px;font-size:11px;font-weight:700;color:var(--bad);background:var(--surface);padding:0 4px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-d);font-size:30px;line-height:1.1}
.habit{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.hdots{display:flex;gap:5px;flex-wrap:wrap}
.hdots button{width:22px;height:22px;border-radius:7px;border:0;background:var(--surface-2);padding:0}
.hdots button[aria-pressed="true"]{background:var(--accent)}
.hdots button.td{outline:2px solid var(--ink-3);outline-offset:1px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.55);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.modal{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:16px}
.modal.wide{width:min(720px,100%)}
.modal header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

/* ---------- schedule engine ---------- */
function occ(date){
  const out=[];
  for(const e of S.events){
    if(e.date===date||(e.rec==='weekly'&&date>=e.date&&dow(date)===dow(e.date)&&!(e.skip||[]).includes(date)))out.push({...e,date});
  }
  for(const d of derivedFor(date))out.push(d);
  return out.sort((a,b)=>mins(a.start)-mins(b.start)||mins(a.end)-mins(b.end));
}
function clashPairs(date){
  const ev=occ(date).filter(e=>e.type!=='rest'&&e.type!=='deadline'),out=[];
  for(let i=0;i<ev.length;i++)for(let j=i+1;j<ev.length;j++)if(mins(ev[j].start)<mins(ev[i].end)&&mins(ev[i].start)<mins(ev[j].end))out.push([ev[i],ev[j]]);
  return out;
}
const loadH=d=>occ(d).filter(e=>BUSY.includes(e.type)).reduce((a,e)=>a+(mins(e.end)-mins(e.start))/60,0);
const winH=()=>(mins(S.profile.availEnd)-mins(S.profile.availStart))/60;
function freeIntervals(date,extra){
  const p=S.profile,w0=mins(p.availStart),w1=mins(p.availEnd),b=+p.buffer;
  const busy=occ(date).filter(e=>e.type!=='rest'&&e.type!=='deadline').map(e=>[mins(e.start)-b,mins(e.end)+b])
    .concat(extra.map(x=>[x[0]-b,x[1]+b])).sort((a,c)=>a[0]-c[0]);
  const out=[];let cur=w0;
  for(const [s,e] of busy){if(s>cur)out.push([cur,Math.min(s,w1)]);cur=Math.max(cur,e);if(cur>=w1)break}
  if(cur<w1)out.push([cur,w1]);
  return out.filter(x=>x[1]-x[0]>=30);
}
const overlap=(a0,a1,b0,b1)=>Math.max(0,Math.min(a1,b1)-Math.max(a0,b0));
const cmpTask=(a,b)=>((a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:b.prio-a.prio);
function remainMin(t){return Math.max(0,Math.round(t.est*((S.learn.estMult||{})[t.subject]||1)*60-(t.sched||0)))}
/* fills the rest of today, from now until the end of the day window, around what is already scheduled */
function todayFill(){
  const p=S.profile,t0=today(),len=Math.max(15,+p.sessionLen),b=+p.buffer,pk=PEAK[p.peak]||PEAK.morning,out={res:[],used:{},from:0,to:0};
  const w1=mins(p.availEnd),st=Math.max(mins(p.availStart),Math.ceil((nowM()+5)/5)*5);
  if(st>w1-15)return out;
  const busy=occ(t0).filter(e=>e.type!=='rest'&&e.type!=='deadline').map(e=>[mins(e.start)-b,mins(e.end)+b]).concat([[780,825],[1200,1245]]).sort((a,c)=>a[0]-c[0]); /* lunch 13:00 and dinner 20:00 are kept free */
  const gaps=[];let cur=st,total=0;
  for(const [a,e] of busy){if(e<=cur)continue;if(a>cur)gaps.push([cur,Math.min(a,w1)]);cur=Math.max(cur,e);if(cur>=w1)break}
  if(cur<w1)gaps.push([cur,w1]);
  const T=S.tasks.filter(x=>!x.done).map(t=>({t,remain:remainMin(t)})).filter(x=>x.remain>=10);
  const urg=t=>{const d=t.due?between(t0,t.due):30;return (t.due&&t.due<t0?100:t.due===t0?90:Math.max(0,60-d*4))+(t.prio||2)*8};
  let last=null;
  for(const [g0,g1] of gaps){
    let c=g0;
    while(g1-c>=15&&total<p.cap*60){
      let best=null;
      for(const x of T){
        if(x.remain<10)continue;
        const ch=Math.min(len,x.remain,g1-c);if(ch<10)continue;
        const ov=overlap(c,c+ch,pk[0],pk[1])/ch;
        const sc=urg(x.t)+ov*((x.t.prio||2)>=3?18:6)-(last===x?14:0);
        if(!best||sc>best.sc)best={sc,x,ch};
      }
      if(!best)break;
      let ch=best.ch;if(best.x.remain-ch>0&&best.x.remain-ch<15&&c+best.x.remain<=g1)ch=best.x.remain;
      const bits=[];
      if(best.x.t.due)bits.push(best.x.t.due<t0?'overdue':best.x.t.due===t0?'due today':'due '+fd(best.x.t.due));
      if(overlap(c,c+ch,pk[0],pk[1])/ch>=.5)bits.push(`inside your ${p.peak} focus window`);
      bits.push(`fits ${hm(g0)} to ${hm(g1)} between your commitments`);
      out.res.push({id:uid(),taskId:best.x.t.id,title:best.x.t.title,date:t0,start:hm(c),end:hm(c+ch),reason:bits.join('. ').replace(/^./,m=>m.toUpperCase())+'.'});
      out.used[best.x.t.id]=(out.used[best.x.t.id]||0)+ch;best.x.remain-=ch;last=best.x;
      c+=ch+b;total+=ch;
    }
  }
  out.capped=total>=p.cap*60;
  if(out.res.length){out.from=mins(out.res[0].start);out.to=mins(out.res[out.res.length-1].end)}
  return out;
}
function generatePlan(){
  const p=S.profile,t0=today(),len=+p.sessionLen,planned={},res=[],unplaced=[];
  const pk=PEAK[p.peak]||PEAK.morning;
  const pre=todayFill();
  for(const x of pre.res){res.push(x);(planned[t0]=planned[t0]||[]).push([mins(x.start),mins(x.end)])}
  for(const t of S.tasks.filter(x=>!x.done).sort(cmpTask)){
    let remain=remainMin(t)-(pre.used[t.id]||0);if(remain<30)continue;
    const last=t.due&&t.due>=t0?t.due:addDays(t0,1),days=[];
    for(let d=t0;d<=last&&days.length<14;d=addDays(d,1))days.push(d);
    const used=new Set();let guard=0;
    while(remain>=30&&guard++<14){
      const chunk=Math.min(len,remain);let best=null;
      for(const d of days){
        const pl=planned[d]||[];
        const load=loadH(d)+pl.reduce((a,x)=>a+(x[1]-x[0])/60,0);
        if(load+chunk/60>p.cap)continue;
        for(const [a,b] of freeIntervals(d,pl)){
          for(let s=Math.ceil(a/15)*15;s+chunk<=b;s+=15){
            if(d===t0&&s<nowM()+15)continue;
            const ov=overlap(s,s+chunk,pk[0],pk[1])/chunk;
            let sc=(t.prio>=3?42:22)*ov+14-Math.min(14,between(t0,d)*2.2)-load*1.6-(used.has(d)?16:0)-(s>=1260?10:0)-(s<510?4:0);
            if(!best||sc>best.sc)best={sc,d,s,load,ov};
          }
        }
      }
      if(!best)break;
      (planned[best.d]=planned[best.d]||[]).push([best.s,best.s+chunk]);used.add(best.d);remain-=chunk;
      const bits=[];
      if(best.ov>=.5)bits.push(`Inside your ${p.peak} focus window`);
      bits.push(`day load ${hrs(best.load+chunk/60)} of ${p.cap}h`);
      if(t.due)bits.push(`due ${fd(t.due)}`);
      res.push({id:uid(),taskId:t.id,title:t.title,date:best.d,start:hm(best.s),end:hm(best.s+chunk),reason:bits.join('. ')+'.'});
    }
    if(remain>=30)unplaced.push({title:t.title,left:remain,due:t.due});
  }
  res.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:mins(a.start)-mins(b.start));
  S.sugs=res;S.unplaced=unplaced;
  const tm=res.filter(x=>x.date===t0).reduce((a,x)=>a+mins(x.end)-mins(x.start),0);
  S.planNote=pre.res.length?`Today: ${pre.res.length} session${pre.res.length>1?'s':''}, ${hrs(tm/60)} of work between ${hm(pre.from)} and ${hm(pre.to)}${pre.capped?`, stopped at your ${p.cap}h daily limit. Lunch and dinner stay free`:'. Lunch and dinner stay free'}.`:(S.tasks.some(x=>!x.done)?'Nothing fits in the rest of today, so the sessions start on the next free day.':'You have no open tasks. Add tasks with an estimate and Aura will fill your free time.');
  save();
}
function acceptSug(id,over){
  const i=S.sugs.findIndex(s=>s.id===id);if(i<0)return false;
  const s={...S.sugs[i],...(over||{})};
  const t=S.tasks.find(x=>x.id===s.taskId);
  const clash=occ(s.date).some(e=>e.type!=='rest'&&e.type!=='deadline'&&mins(e.start)<mins(s.end)&&mins(s.start)<mins(e.end));
  S.events.push({id:'e'+uid(),title:'Study: '+s.title,type:'study',date:s.date,start:s.start,end:s.end,taskId:s.taskId});
  if(t)t.sched=(t.sched||0)+(mins(s.end)-mins(s.start));

}
function atRisk(t){
  if(t.done||!t.due)return false;

  const rem=remainMin(t)/60;if(rem<=0)return false;
  let free=0;for(let d=t0;d<=t.due;d=addDays(d,1))free+=Math.max(0,Math.min(S.profile.cap-loadH(d),winH()-loadH(d)));

}
function alerts(){
  const t0=today(),out=[];
  for(let i=0;S.notif.clashes&&i<14;i++){const d=addDays(t0,i);for(const [a,b] of clashPairs(d))out.push({k:'clash',tone:'bad',title:`Clash on ${rel(d)==='Today'||rel(d)==='Tomorrow'?rel(d):fd(d)}`,detail:`${a.title} (${a.start}) overlaps ${b.title} (${b.start}).`,act:'calDay',arg:d,label:'See it'})}

function score(al){

  for(const e of occ(t0)){rows.push({t:mins(e.start),h:`<button class="evc ${clashIds(t0).has(e.id)?'clash':''}" style="--c:${col(e.type)}" data-act="evOpen" data-arg="${e.id}" data-date="${t0}"><div><b>${esc(e.title)}</b><span class="sm muted num">${e.start} to ${e.end}${e.loc?' · '+esc(e.loc):''}</span></div></button>`})}
  for(const [a,b] of freeIntervals(t0,[]))if(b-Math.max(a,nowM())>=60)rows.push({t:Math.max(a,nowM()),h:`<div class="free">Free ${hm(Math.max(a,nowM()))} to ${hm(b)} · ${dur(b-Math.max(a,nowM()))} for focused work</div>`});
  rows.push({t:nowM()-.5,now:1});
  rows.sort((a,b)=>a.t-b.t);
  const tl=rows.filter(r=>occ(t0).length||!r.now).map(r=>r.now?`<div class="nowrow"><span class="num">${hm(nowM())}</span><i></i></div>`:`<div class="tl-row"><div class="tm num">${hm(Math.floor(r.t))}</div>${r.h}</div>`).join('');
  // deadlines
  const dls=[];
  for(const t of S.tasks.filter(x=>!x.done&&x.due))dls.push({d:t.due,title:t.title,sub:`${hrs(remainMin(t)/60)} left`,risk:atRisk(t)});
  for(let i=0;i<21;i++)for(const e of occ(addDays(t0,i)))if(e.type==='exam'||e.type==='deadline')dls.push({d:e.date,title:e.title,sub:e.type==='exam'?'Exam':'Deadline',risk:false,ev:1});
  dls.sort((a,b)=>a.d<b.d?-1:1);
  const wk=monday(t0);
  return `
  <section class="hero fadein">
    <div>
      <h1>${greet}, ${esc(p.name||'there')}.</h1>
      <p class="sub">${long}. ${status}</p>
      ${nx?`<div class="next"><div style="flex:1;min-width:0"><small>Next up</small><div class="when" style="font-size:18px">${esc(nx.title)}</div><small>${untilText(nx)}${nx.loc?' · '+esc(nx.loc):''}</small></div></div>`:''}
      <div class="row" style="margin-top:18px">
        <button class="btn pri" data-act="fixWeek">${ico('bolt',18)}Fix my week</button>
        <button class="btn" data-act="nav" data-arg="assistant">${ico('chat',18)}Ask Aura</button>
        <button class="btn" data-act="openAdd" data-arg="${t0}">${ico('plus',18)}Add event</button>
      </div>
    </div>
    <div class="ring" role="img" aria-label="${has?`Week health ${sc} out of 100`:'Week health: add your week to see its balance'}">
      <svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="66" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="12"/><circle cx="84" cy="84" r="66" fill="none" stroke="${ringCol}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*sc/100} ${C}"/></svg>
      <div><b class="num">${has?sc:'–'}</b><span>${has?'Week health':'Add your week'}</span></div>
    </div>
  </section>
  <div class="grid2">
    <section class="card"><header><h2>Today</h2><button class="btn sm ghost" data-act="nav" data-arg="calendar">Open calendar</button></header>
      ${occ(t0).length?`<div class="tl">${tl}</div>`:`<div class="empty"><b>Nothing scheduled today</b>Use the time for something ahead of schedule, or rest.<div style="margin-top:12px"><button class="btn sm" data-act="nav" data-arg="plan">See suggested sessions</button></div></div>`}
    </section>
    <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <section class="card"><header><h2>Needs attention</h2>${al.length?`<span class="pill bad">${al.length}</span>`:''}</header>
        ${al.length?al.slice(0,5).map(a=>`<div class="alert ${a.tone}"><div class="ai">${ico('warn',18)}</div><div style="flex:1;min-width:0"><div class="t">${esc(a.title)}</div><div class="sm muted">${esc(a.detail)}</div></div><button class="btn sm" data-act="${a.act}" data-arg="${a.arg}">${a.label}</button></div>`).join(''):has?`<div class="empty"><b>All clear</b>No clashes, overloaded days or at-risk deadlines.</div>`:`<div class="empty"><b>Nothing to check yet</b>Add your classes and tasks, and Aura will look for clashes and risks.</div>`}
      </section>
      <section class="card"><header><h2>Coming up</h2><button class="btn sm ghost" data-act="nav" data-arg="tasks">All tasks</button></header>
        ${dls.slice(0,6).map(x=>`<div class="dl"><div style="min-width:0"><div class="tt" style="font-weight:600">${esc(x.title)}</div><div class="sm muted">${x.sub}</div></div><div style="text-align:right;flex:none"><div class="sm" style="font-weight:650">${rel(x.d)}</div>${x.risk?'<span class="pill warn">At risk</span>':`<span class="sm faint">${fd(x.d)}</span>`}</div></div>`).join('')||'<div class="empty">No deadlines ahead.</div>'}
      </section>
    </div>
  </div>
  ${habitsCard()}
  <section class="card"><header><h2>This week</h2><button class="btn sm ghost" data-act="nav" data-arg="insights">Workload</button></header>
    <div class="wk">${Array.from({length:7},(_,i)=>{const d=addDays(wk,i),b=dayBreak(d),n=occ(d).filter(e=>e.type!=='rest').length;return `<button class="wkd ${d===t0?'now':''}" data-act="calDay" data-arg="${d}"><span class="sm" style="font-weight:700">${DOW[i]} <span class="faint">${pd(d).getDate()}</span></span><div class="bar" title="${hrs(b.study)} study and class, ${hrs(b.work)} work"><i style="width:${b.study/winH()*100}%;background:var(--c-class)"></i><i style="width:${b.work/winH()*100}%;background:var(--c-hack)"></i></div><span class="sm muted num">${hrs(b.study+b.work)} busy</span><span class="sm faint">${n} ${n===1?'item':'items'}${clashPairs(d).length?' · <b style="color:var(--bad)">clash</b>':''}</span></button>`}).join('')}</div>
  </section>`;
};
function clashIds(d){const s=new Set();for(const [a,b] of clashPairs(d)){s.add(a.id);s.add(b.id)}return s}
function dayBreak(d){let study=0,work=0;for(const e of occ(d)){const h=(mins(e.end)-mins(e.start))/60;if(['class','exam','study'].includes(e.type))study+=h;else if(['job','hackathon','community'].includes(e.type))work+=h}return {study,work,free:Math.max(0,winH()-study-work)}}

/* calendar */
const H0=7,H1=23,HH=48;
VIEWS.calendar=()=>{
  const t0=today(),mode=UI.calMode,d=UI.calDate,wk=monday(d);
  const days=mode==='week'?Array.from({length:7},(_,i)=>addDays(wk,i)):[d];
  const sugEv=S.sugs;
  const gut=Array.from({length:H1-H0},(_,i)=>`<span style="top:${i*HH}px">${pad(H0+i)}:00</span>`).join('');
  const cols=days.map(day=>{
    const ci=clashIds(day);
    const evs=occ(day).filter(e=>e.type!=='rest'||true).map(e=>{
      const s=Math.max(mins(e.start),H0*60),en=Math.min(mins(e.end),H1*60);if(en<=s)return '';
      const top=(s-H0*60)/60*HH,h=Math.max(22,(en-s)/60*HH-2);
      return `<button class="ev ${ci.has(e.id)?'clash':''}" style="--c:${col(e.type)};top:${top}px;height:${h}px" data-act="evOpen" data-arg="${e.id}" data-date="${day}"><b>${esc(e.title)}</b>${h>40?`<span class="num">${e.start} to ${e.end}</span>`:''}</button>`}).join('');
    const sg=sugEv.filter(s=>s.date===day).map(s=>{const top=(mins(s.start)-H0*60)/60*HH,h=(mins(s.end)-mins(s.start))/60*HH-2;return `<button class="ev sug" style="--c:var(--c-study);top:${top}px;height:${h}px" data-act="nav" data-arg="plan" title="Suggested session"><b>Suggested: ${esc(s.title)}</b></button>`}).join('');
    const nl=day===t0&&nowM()>=H0*60&&nowM()<=H1*60?`<div class="nowline" style="top:${(nowM()-H0*60)/60*HH}px"></div>`:'';
    return `<div class="col ${day===t0?'now':''}" style="height:${(H1-H0)*HH}px">${evs}${sg}${nl}</div>`;
  }).join('');
  const heads=days.map(day=>`<div class="hd ${day===t0?'now':''}">${DOW[dow(day)]}<br><b>${pd(day).getDate()}</b></div>`).join('');
  const title=mode==='week'?`${fd(wk)} to ${fd(addDays(wk,6))}`:pd(d).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  const wkd=Array.from({length:7},(_,i)=>addDays(wk,i));
  const cl=days.reduce((a,x)=>a+clashPairs(x).length,0);
  return head('Calendar',title,`
    <div class="seg" role="group" aria-label="View"><button aria-pressed="${mode==='day'}" data-act="calMode" data-arg="day">Day</button><button aria-pressed="${mode==='week'}" data-act="calMode" data-arg="week">Week</button></div>
    <button class="btn icon-btn" data-act="calPrev" aria-label="Previous">‹</button><button class="btn" data-act="calToday">Today</button><button class="btn icon-btn" data-act="calNext" aria-label="Next">›</button>
    <button class="btn" data-act="icsOpen">${ico('export',18)}Export</button>
    <button class="btn pri" data-act="openAdd" data-arg="${d}">${ico('plus',18)}Add event</button>`)
  +(mode==='day'?`<div class="daystrip">${wkd.map(x=>`<button aria-pressed="${x===d}" data-act="calDay" data-arg="${x}">${DOW[dow(x)]}<b>${pd(x).getDate()}</b></button>`).join('')}</div>`:'')
  +(cl?`<div class="banner"><span>${ico('warn',20)}</span><div><b>${cl} ${cl===1?'clash':'clashes'} in view.</b> Overlapping items have a red outline. Open one to move or remove it.</div></div>`:'')
  +`<div class="calwrap"><div class="cal" style="--n:${days.length};--minw:${mode==='week'?820:0}px"><div class="hd"></div>${heads}<div class="gut" style="height:${(H1-H0)*HH}px">${gut}</div>${cols}</div></div>
  <div class="legend">${['class','exam','hackathon','job','study','community','personal','rest'].map(k=>`<span><i class="dot" style="--c:${col(k)}"></i>${TYPES[k].l}</span>`).join('')}</div>`;
};

/* tasks */

    <form data-form="taskAdd" class="fgrid" style="align-items:end">

   <section class="card"><header><h2>Break a big goal into steps</h2></header>
    <form data-form="goalGen" class="fgrid" style="align-items:end">
      <label class="f" style="grid-column:1/-1">Goal<input class="in" id="g-title" name="goal" required placeholder="Ship a demo at HackFest"></label>
      <label class="f">Type<select class="in" id="g-kind" name="kind"><option value="hackathon">Hackathon</option><option value="assignment">Assignment</option><option value="application">Application</option><option value="exam">Exam prep</option></select></label>
      <label class="f">Finish by<input class="in" type="date" id="g-due" name="due" value="${addDays(t0,10)}"></label>
      <button class="btn pri" style="grid-column:1/-1">${ico('bolt',18)}Create steps</button></form></section></div>`
  +(Object.keys(groups).length?`<section class="card"><header><h2>Goals in progress</h2></header><div class="grid3">${Object.entries(groups).map(([g,ts])=>{const d=ts.filter(t=>t.done).length;return `<div class="gprog"><div class="row" style="justify-content:space-between"><b>${esc(g)}</b><span class="sm muted num">${d} of ${ts.length}</span></div><div class="meter"><i style="width:${d/ts.length*100}%"></i></div></div>`}).join('')}</div></section>`:'')
  +(()=>{const x=tasksExtra();return x.chips+x.rem+x.arc})()+`<section class="card"><header><h2>${tab==='done'?'Completed':tab==='all'?'All tasks':'To do'}</h2><span class="pill">${list.length}</span></header>`
  +(list.length?list.map(t=>{const risk=atRisk(t),ov=t.due&&t.due<t0&&!t.done;return `<div class="task ${t.done?'done':''}"><button class="cb" role="checkbox" aria-checked="${t.done}" aria-label="Mark ${esc(t.title)} done" data-act="taskToggle" data-arg="${t.id}">${ico('check',16)}</button><div style="min-width:0"><div class="tt">${esc(t.title)}</div><div class="meta"><span>${esc(t.subject||'')}</span>${catSel(t)}${t.due?`<span class="num" style="${ov?'color:var(--bad);font-weight:700':''}">${rel(t.due)} · ${fd(t.due)}${t.dueTime?' · '+t.dueTime:''}</span>`:''}<span class="num">${hrs(t.est)}</span><span class="pill ${PR[t.prio][1]}">${PR[t.prio][0]}</span>${t.rec?`<span class="pill acc">${ico('repeat',12)}${t.rec}</span>`:''}${t.sched?`<span class="pill ok">${hrs(t.sched/60)} booked</span>`:''}${risk&&!t.done?'<span class="pill warn">At risk</span>':''}${!t.done&&t.due?`<button class="btn sm ghost" style="padding:2px 8px;min-height:0" data-act="taskTime" data-arg="${t.id}">${t.dueTime?'Change alert time':'Set alert time'}</button>`:''}</div></div><button class="btn sm ghost icon-btn" style="width:34px;height:34px" aria-label="Delete task" data-act="taskDel" data-arg="${t.id}">${ico('trash',16)}</button></div>`}).join(''):`<div class="empty"><b>${tab==='done'?'Nothing finished yet':'You are all caught up'}</b>${tab==='done'?'Completed tasks show up here.':'Add a task above, or break a goal into steps.'}</div>`)
  +`</section>`;
};
const TEMPL={
 hackathon:[['Pick teammates and agree roles',.1,1],['Research the problem and choose a stack',.25,2],['Build a rough prototype',.6,6],['Polish the demo and write the README',.85,3],['Rehearse the 2-minute pitch',.95,1]],
 assignment:[['Read the brief and list requirements',.1,.5],['Draft the first version',.5,3],['Review and fill the gaps',.8,1.5],['Final check and submit',.95,.5]],
 application:[['Check eligibility and deadlines',.1,.5],['Gather documents and links',.35,1.5],['Write the application',.7,2],['Proofread and submit',.95,.5]],
 exam:[['Collect notes and past papers',.1,1],['Revise the first half of the syllabus',.4,3],['Practise past questions',.7,3],['Final recap and an early night',.92,1.5]]
};
function makeSteps(kind,goal,due){
  const t0=today(),span=Math.max(2,between(t0,due));
  for(const [s,f,h] of TEMPL[kind])S.tasks.push({id:'t'+uid(),title:s,subject:goal,group:goal,due:addDays(t0,Math.floor(span*f)),est:h,prio:kind==='hackathon'?3:2,done:false,sched:0});
  save();
}

/* smart plan */
VIEWS.plan=()=>{
  const p=S.profile,byDay={};S.sugs.forEach(s=>(byDay[s.date]=byDay[s.date]||[]).push(s));
  const total=S.sugs.reduce((a,s)=>a+(mins(s.end)-mins(s.start)),0);
  return head('Smart plan','Suggested study blocks that fit around your classes, shifts and rest. You decide what goes on the calendar.',`<button class="btn pri" data-act="planGen">${ico('bolt',18)}${S.sugs.length?'Regenerate':'Generate plan'}</button>${S.sugs.length?`<button class="btn" data-act="acceptAll">${ico('check',18)}Accept all (${S.sugs.length})</button>`:''}`)
  +`<section class="card"><div class="row" style="gap:8px 10px">
     <span class="pill acc">Peak focus: ${p.peak}</span><span class="pill">Window ${p.availStart} to ${p.availEnd}</span><span class="pill">Max ${p.cap}h a day</span><span class="pill">${p.buffer} min breaks</span><span class="pill">${p.sessionLen} min sessions</span>
     <button class="btn sm ghost" data-act="nav" data-arg="profile">Change</button></div></section>`
  +(S.planNote&&S.sugs.length?`<p class="sm muted" style="margin:8px 2px">${esc(S.planNote)}</p>`:'')
  +(S.unplaced.length?`<div class="banner"><span>${ico('warn',20)}</span><div><b>Not everything fits.</b> ${S.unplaced.map(u=>`${esc(u.title)} still needs ${dur(u.left)}${u.due?` before ${fd(u.due)}`:''}`).join('; ')}. Move a deadline, raise your daily limit, or drop something.</div></div>`:'')
  +`<section class="card"><header><h2>Suggestions</h2>${S.sugs.length?`<span class="pill acc">${hrs(total/60)} across ${Object.keys(byDay).length} days</span>`:''}</header>`
  +(S.sugs.length?Object.keys(byDay).sort().map(d=>`<div class="daylbl">${rel(d)} · ${fd(d)}</div>`+byDay[d].map(s=>`<div class="sug"><div class="slot num">${s.start}<small>to ${s.end}</small></div><div style="min-width:0"><div class="tt">${esc(s.title)}</div><div class="sm muted">${esc(s.reason)}</div></div><div class="row acts"><button class="btn sm pri" data-act="sugAccept" data-arg="${s.id}">Accept</button><button class="btn sm" data-act="sugEdit" data-arg="${s.id}">Modify</button><button class="btn sm ghost" data-act="sugReject" data-arg="${s.id}">Reject</button></div>
    ${UI.editSug===s.id?`<form class="editrow" data-form="sugSave" data-id="${s.id}"><label class="f">Date<input class="in" type="date" name="date" value="${s.date}"></label><label class="f">Start<input class="in" type="time" name="start" value="${s.start}"></label><label class="f">End<input class="in" type="time" name="end" value="${s.end}"></label><button class="btn pri sm">Save and accept</button></form>`:''}</div>`).join('')).join(''):`<div class="empty"><b>${S.tasks.some(t=>!t.done)?'No plan yet':'Nothing to plan'}</b>${S.tasks.some(t=>!t.done)?'Generate a plan and Aura will place study blocks in your free time.':'Add a task first.'}<div style="margin-top:14px"><button class="btn pri" data-act="planGen">Generate plan</button></div></div>`)
  +`</section>
  <section class="card"><header><h2>How it decides</h2></header><div class="grid3">

    <div><b>Protects rest</b><p class="sm muted">No day goes past ${p.cap} hours, and nothing is placed outside ${p.availStart} to ${p.availEnd}.</p></div></div></section>`;

/* insights */
VIEWS.insights=()=>{
  const wk=UI.insWeek,days=Array.from({length:7},(_,i)=>addDays(wk,i)),b=days.map(dayBreak),W=winH(),cap=S.profile.cap,t0=today();
  const st=b.reduce((a,x)=>a+x.study,0),wo=b.reduce((a,x)=>a+x.work,0),fr=b.reduce((a,x)=>a+x.free,0);
  const over=b.filter(x=>x.study+x.work>cap).length,avg=(st+wo)/7;
  const risk=over>=2||avg>cap*.85?['High','bad','Several days run past your limit. Move something or say no to a new commitment.']:over===1||avg>cap*.65?['Moderate','warn','One heavy day. Keep the next day lighter.']:['Low','ok','Your week has room to breathe.'];
  return head('Insights','How your hours split between study, work and recovery.',`<button class="btn icon-btn" data-act="insPrev" aria-label="Previous week">‹</button><span class="pill">${fd(wk)} to ${fd(addDays(wk,6))}</span><button class="btn icon-btn" data-act="insNext" aria-label="Next week">›</button>`)
  +`<div class="grid2"><section class="card"><header><h2>Week by day</h2><div class="legend"><span><i class="dot" style="--c:var(--c-class)"></i>Study and class</span><span><i class="dot" style="--c:var(--c-hack)"></i>Work and projects</span><span><i class="dot" style="--c:var(--c-rest)"></i>Free and recovery</span></div></header>
    <div class="chart"><div class="capline" style="top:${210-Math.min(cap,W)/W*210+8}px"><span>Your limit ${cap}h</span></div>
    ${days.map((d,i)=>{const x=b[i];return `<div class="cbar" title="${fd(d)}: ${hrs(x.study)} study and class, ${hrs(x.work)} work, ${hrs(x.free)} free"><div class="cstack"><i style="height:${x.study/W*100}%;background:var(--c-class)"></i><i style="height:${x.work/W*100}%;background:var(--c-hack)"></i><i style="height:${x.free/W*100}%;background:var(--c-rest);opacity:.55"></i></div><div class="sm num" style="font-weight:${d===t0?800:600};color:${d===t0?'var(--accent-ink)':'var(--ink-2)'}">${DOW[i]}</div><div class="sm faint num">${hrs(x.study+x.work)}</div></div>`}).join('')}</div>
    <p class="sm faint" style="margin-top:12px">Bars show your ${S.profile.availStart} to ${S.profile.availEnd} day. The dashed line is your daily limit.</p></section>
   <section class="card" style="display:flex;flex-direction:column;gap:18px"><header style="margin:0"><h2>Balance</h2><span class="pill ${risk[1]}">Burnout risk: ${risk[0]}</span></header>
    <p class="muted sm">${risk[2]}</p>
    <div class="stat"><b class="num" style="color:var(--c-class)">${hrs(st)}</b><span class="sm muted">Study and class</span></div>
    <div class="stat"><b class="num" style="color:var(--c-hack)">${hrs(wo)}</b><span class="sm muted">Work, hackathons, communities</span></div>
    <div class="stat"><b class="num" style="color:var(--c-rest)">${hrs(fr)}</b><span class="sm muted">Free and recovery</span></div></section></div>`
  +`<section class="card"><header><h2>Daily habits</h2><form data-form="habitAdd" class="row"><input class="in" id="hb-name" name="name" placeholder="New habit" aria-label="New habit name" style="width:170px" required><button class="btn sm">${ico('plus',16)}Add</button></form></header>`
  +S.habits.map(h=>{const st=streak(h);return `<div class="habit"><div><b>${esc(h.name)}</b><div class="sm ${st?'':'faint'}" style="${st?'color:var(--gold);font-weight:700':''}">${st?`${st}-day streak`:'No streak yet'}</div></div><div class="hdots" role="group" aria-label="${esc(h.name)}, last 14 days">${Array.from({length:14},(_,i)=>{const d=addDays(t0,i-13);return `<button class="${d===t0?'td':''}" aria-pressed="${!!h.log[d]}" aria-label="${fd(d)}" title="${fd(d)}" data-act="habitToggle" data-arg="${h.id}" data-date="${d}"></button>`}).join('')}</div><button class="btn sm ghost icon-btn" style="width:34px;height:34px" aria-label="Delete habit" data-act="habitDel" data-arg="${h.id}">${ico('trash',16)}</button></div>`}).join('')
  +`</section>`;
};
function streak(h){let d=today(),n=0;if(!h.log[d])d=addDays(d,-1);while(h.log[d]){n++;d=addDays(d,-1)}return n}

function buddyResults(q){
  q=String(q||'').trim().toLowerCase();S.buddies=S.buddies||[];
  if(!q)return '<p class="sm muted">Type to search. Results show people you can add, and people already in your group.</p>';
  const mine=S.buddies.filter(b=>[b.name,...(b.courses||[]),...(b.interests||[])].join(' ').toLowerCase().includes(q));
  const have=new Set(S.buddies.map(b=>b.name.toLowerCase()));
  const sug=PEERS.filter(x=>!have.has(x.n.toLowerCase())&&[x.n,...x.c,...x.i].join(' ').toLowerCase().includes(q));
  const row=(name,sub,tag,btn)=>`<div class="row" style="justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)"><div style="min-width:0"><b>${esc(name)}</b> <span class="pill ${tag==='Added by you'?'ok':''}">${tag}</span><div class="sm muted">${sub}</div></div>${btn}</div>`;
  const typed=String(q).length>=2&&!have.has(q)&&!PEERS.some(x=>x.n.toLowerCase()===q)&&!sug.length&&!mine.length;
  const rawName=document.getElementById('bq')?document.getElementById('bq').value.trim():'';
  return (mine.map(b=>row(b.name,'Already in your study group','Added by you','<span class="sm muted">Added</span>')).join('')
   +sug.map(x=>row(x.n,'Demo classmate · '+esc(x.c.join(', ')),'Suggestion',`<button class="btn sm" data-act="buddyFromSug" data-arg="${esc(x.n)}">${ico('plus',16)}Add</button>`)).join('')
   +(typed&&rawName?row(rawName,'Add this person by name. Nothing is sent to them.','New person',`<button class="btn sm pri" data-act="buddyAddName" data-arg="${esc(rawName)}">${ico('plus',16)}Add "${esc(rawName.slice(0,24))}"</button>`):''))||'<p class="sm muted">No match.</p>';
}

function icsText(from,to){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AuraStudent//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:AuraStudent'],stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const q=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'),dt=(d,t)=>d.replace(/-/g,'')+'T'+t.replace(':','')+'00';
  for(let d=from;d<=to;d=addDays(d,1))for(const e of occ(d)){
    L.push('BEGIN:VEVENT',`UID:${e.id}-${d}@aurastudent`,`DTSTAMP:${stamp}`,`DTSTART:${dt(d,e.start)}`,`DTEND:${dt(d,e.end)}`,`SUMMARY:${q(e.title)}`);
    if(e.loc)L.push(`LOCATION:${q(e.loc)}`);
    L.push(`CATEGORIES:${TYPES[e.type].l.toUpperCase()}`,`TRANSP:${BUSY.includes(e.type)?'OPAQUE':'TRANSPARENT'}`,'BEGIN:VALARM',`TRIGGER:-PT${+S.notif.eventLead||15}M`,'ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT');
  }
  for(const e of entries()){if(!e.date||e.time||e.done||e.dis||e.rsvp==='no'||e.date<from||e.date>to)continue;L.push('BEGIN:VEVENT',`UID:${e.k}${e.id}@aurastudent`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${e.date.replace(/-/g,'')}`,`SUMMARY:${q(e.title+(e.status==='verify'?' (date unverified)':''))}`,'TRANSP:TRANSPARENT','BEGIN:VALARM',e.remind==='1d'?'TRIGGER:-PT15H':'TRIGGER:PT9H','ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT')}
  L.push('END:VCALENDAR');return L.join('\r\n');
}

const REM=[];let AC;
function beep(){if(!S.notif.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.12,AC.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.45);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.5)}catch(e){}}
function showRems(){$('#rems').innerHTML=REM.map((r,i)=>`<div class="rem" role="alert"><b>${esc(r.title)}</b><span class="sm muted">${esc(r.body)}</span><div class="row"><button class="btn sm" data-act="remSnooze" data-arg="${i}">Snooze 10 min</button><button class="btn sm pri" data-act="remDismiss" data-arg="${i}">Got it</button></div></div>`).join('')}
function fireRem(key,title,body){
  if(S.fired[key])return;S.fired[key]=Date.now();save();
  REM.push({title,body});showRems();beep();
  try{if(!(S.push&&S.push.on)&&'Notification' in window&&Notification.permission==='granted'){if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(g=>g.showNotification(/^AuraStudent/i.test(title)?title:'AuraStudent \u00b7 '+title,{body,icon:'icon-192.png',badge:'badge-96.png',tag:key,renotify:true,requireInteraction:true,silent:false,vibrate:[250,120,250,120,400]})).catch(()=>{});else new Notification(title,{body})}}catch(e){}
}
function checkReminders(){
  const n=nowM(),t0=today(),lead=+S.notif.eventLead||15;
  if(S.notif.events)for(const e of occ(t0)){const st=mins(e.start);if(!e.ro&&e.type!=='rest'&&st>n&&st-n<=lead)fireRem(`ev:${e.id}:${t0}`,e.title,`Starts in ${st-n} min${e.loc?' · '+e.loc:''}`)}
  if(S.notif.deadlines&&n>=480){
    for(const t of S.tasks){if(t.done||!t.due)continue;const d=between(t0,t.due);
      if(d<0)fireRem(`od:${t.id}:${t0}`,`Overdue: ${t.title}`,`Was due ${fd(t.due)}. Reschedule it or finish it today.`);
      else if(d===0)fireRem(`d0:${t.id}:${t0}`,`Due today: ${t.title}`,`${hrs(remainMin(t)/60)} of work still unbooked or open.`);
      else if(d===1&&S.notif.lead!=='same')fireRem(`d1:${t.id}:${t0}`,`Due tomorrow: ${t.title}`,`${hrs(remainMin(t)/60)} left. Fit it in today if you can.`)}
    if(S.notif.lead!=='same')for(const e of occ(addDays(t0,1)))if(e.type==='exam'||e.type==='deadline')fireRem(`x1:${e.id}:${t0}`,`Tomorrow: ${e.title}`,`${e.start}${e.loc?' · '+e.loc:''}`);
  }
}

const RULES=`You are Aura, a practical and supportive planning assistant inside a student's planner app. Be concise and plain, no emojis, no flattery. Be supportive and practical, and protect breaks and rest in every plan.

- Say "about" or "estimate" for any time estimate. exampleOpportunities are examples whose dates are NOT confirmed: say they must be checked at the source.
- You cannot register, apply, contact anyone, spend money or share personal information. You only suggest; the student does those things.
- Protect rest: keep breakBetweenItemsMin between items, stay inside dayWindow and maxHoursPerDay, and leave a lighter evening or day where you can.
- studentCorrections come from the student and override your assumptions.
- Schedule changes go in "proposals" and the app shows them for approval. Never say a change has been made.
- Proposal shapes: {"kind":"event","title":string,"type":"study"|"personal"|"rest"|"hackathon"|"community","date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","why":string,"taskId":optional id from openTasks} ; {"kind":"task","title":string,"subject":string,"due":"YYYY-MM-DD" or null,"estHours":number,"prio":1|2|3,"why":string} ; {"kind":"move","eventId":id from next8Days items with repeats=false,"newDate":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","why":string}.

- To compare courses or priorities, weigh relevance to goals, nearest deadline, unbooked hours and the student's progress, and state what each choice costs or saves.
- To suggest tradeoffs, name them plainly (for example "moving this frees Thursday evening but delays the lab record by a day").
Reply with ONLY one JSON object: {"reply": string (under 170 words; simple markdown with **bold** and "- " bullets), "basis": [short strings naming the data you used], "assumptions": [short strings for estimates you made], "proposals": []}`;

      if(placed)props.push({kind:'move',eventId:mv.id,date:mv.date,newDate:placed.dd,start:hm(placed.st),end:hm(placed.st+len),why:`Clears the clash with ${fixed.title}. Tradeoff: ${placed.dd===d?'same day, so the day stays busy':'a different day, so tell anyone it affects'}.`});
    }
  }
  for(const a of al.filter(x=>x.k==='load').slice(0,1)){
    const mv=occ(a.arg).find(e=>!e.rec&&e.type==='study');if(!mv)continue;
    const len=mins(mv.end)-mins(mv.start);let best=null;
    for(let i=0;i<7;i++){const dd=addDays(t0,i);if(dd===a.arg||loadH(dd)+len/60>S.profile.cap)continue;const st=findSlot(dd,len,[]);if(st!==null&&(!best||loadH(dd)<best.l))best={dd,st,l:loadH(dd)}}
    if(best)props.push({kind:'move',eventId:mv.id,date:mv.date,newDate:best.dd,start:hm(best.st),end:hm(best.st+len),why:`Takes load off ${fd(a.arg)}. Tradeoff: it lands on ${fd(best.dd)}, your lightest day with room.`});
  }
  for(const a of al.filter(x=>x.k==='risk'||x.k==='overdue').slice(0,2))notes.push(`For "${a.title.replace(/^(At risk|Overdue): /,'')}", book blocks in Smart plan, or settle for a shorter pass that covers the essentials in 60 minutes. That saves time but may lower quality.`);
  return RR(`**What I found:**\n${lines.join('\n')}${notes.length?'\n\n'+notes.map(n=>'- '+n).join('\n'):''}${props.length?'\n\nReview the proposed moves below before applying them.':''}`,props,['Your calendar for 14 days','Open tasks and estimates','Your daily limit'],['Hours left per task are estimates']);
}

const STOP=new Set('the and for with that this from are was were been have has had its into than then they which their there these those can will not but also about when what your you our out over such more most each other any all one two may who how why only some very much many same'.split(' '));
function localNotes(text,subject){
  const flat=text.replace(/\s+/g,' ').trim(),sents=(flat.match(/[^.!?]+[.!?]/g)||[flat]).map(s=>s.trim()).filter(s=>s.length>35&&s.length<260);
  const freq={};(flat.toLowerCase().match(/[a-z][a-z-]{3,}/g)||[]).forEach(w=>{if(!STOP.has(w))freq[w]=(freq[w]||0)+1});
  const scored=sents.map((s,i)=>({s,i,sc:((s.toLowerCase().match(/[a-z][a-z-]{3,}/g)||[]).reduce((a,w)=>a+(freq[w]||0),0))/Math.sqrt(s.length)})).sort((a,b)=>b.sc-a.sc);
  const summary=scored.slice(0,6).sort((a,b)=>a.i-b.i).map(x=>x.s);
  const terms=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>({term:x[0],meaning:''}));
  const questions=[];
  for(const x of scored.slice(0,8)){
    const ws=(x.s.match(/[A-Za-z][A-Za-z-]{4,}/g)||[]).filter(w=>!STOP.has(w.toLowerCase())).sort((a,b)=>(freq[b.toLowerCase()]||0)-(freq[a.toLowerCase()]||0));
    if(!ws.length)continue;const w=ws[0];
    questions.push({q:'Fill the gap: '+x.s.replace(new RegExp('\\b'+w+'\\b'),'_____'),a:w+'. From your notes: "'+x.s+'"',st:''});
    if(questions.length>=6)break;
  }
  const n=questions.length||1;
  return {summary,terms,questions,tasks:[{title:`Review notes: ${subject}`,estHours:.5,dueInDays:1},{title:`Answer ${n} practice ${n===1?'question':'questions'} from memory (${subject})`,estHours:.75,dueInDays:3},{title:`Second pass on weak points (${subject})`,estHours:.5,dueInDays:7}],source:'local'};
}
async function genNotes(text,subject){
  const sm=await getSample();
  if(sm){
    try{
      const r=await sm.json(`You help a student revise. Use ONLY the notes below and do not add facts that are not in them. Reply with ONLY one JSON object: {"summary":[5 to 8 short bullet strings],"keyTerms":[{"term":string,"meaning":string}] (up to 8),"questions":[{"q":string,"a":string}] (6 to 8, mixing recall and "explain why"),"tasks":[{"title":string,"estHours":number,"dueInDays":integer from 1 to 10}] (2 to 4 review tasks; hours are estimates)}.\nSubject: ${subject}\nNOTES:\n${text.slice(0,12000)}`,{cache:false});
      if(!r||!Array.isArray(r.summary)||!Array.isArray(r.questions))throw {code:'invalid_json'};
      return {summary:r.summary.map(String).slice(0,10),terms:(r.keyTerms||[]).slice(0,8).map(x=>({term:String(x.term),meaning:String(x.meaning||'')})),questions:r.questions.slice(0,10).map(x=>({q:String(x.q),a:String(x.a),st:''})),tasks:(r.tasks||[]).slice(0,4).map(t=>({title:String(t.title).slice(0,90),estHours:Math.min(8,Math.max(.25,+t.estHours||.5)),dueInDays:Math.min(14,Math.max(1,Math.round(+t.dueInDays)||3))})),source:'claude'};
    }catch(e){const r=localNotes(text,subject);r.note=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)?'Claude is not available here, so the built-in summariser was used.':'Claude could not finish ('+(e.code||'error')+'), so the built-in summariser was used.';return r}
  }
  return localNotes(text,subject);
}

function entryRems(){
  const t0=today(),n=nowM();
  for(const e of entries()){
    if(!e.date||e.done||e.dis||e.remind==='none'||e.rsvp==='no'||(e.snooze&&e.snooze>t0))continue;
    const dd=between(t0,e.date);if(dd<0)continue;
    const lead={'0m':0,'15m':15,'1h':60}[e.remind];let tgt;
    if(lead!==undefined&&e.time)tgt=dd*1440+mins(e.time)-lead;else tgt=(dd-(e.remind==='1d'?1:0))*1440+480;
    const end=dd*1440+(e.time?mins(e.time)+e.dur:1440);
    if(tgt<=n&&n<end)fireRem(`en:${eKey(e)}:${e.date}:${e.remind}`,e.title+(e.status==='verify'?' (date not confirmed)':''),`${rel(e.date)}${e.time?' at '+e.time:''}${e.status==='verify'?'. Check this date at its source.':''}`);
  }
  if(n>=480)for(const i of S.items){if(i.next&&!i.nextDone&&!i.done&&!i.dismissed&&i.nextDue&&i.nextDue<=t0&&i.nextDue>=addDays(t0,-3))fireRem(`na:${i.id}:${i.nextDue}`,`Next action: ${i.next}`,`For ${i.title}. ${i.nextDue<t0?'Overdue.':'Due today.'}`)}
}

const BDRE=/^\d{4}-\d{2}-\d{2}$/,BTRE=/^([01]\d|2[0-3]):[0-5]\d$/;
const COLS=[['events','Calendar events'],['tasks','Tasks'],['habits','Habits'],['items','Captured items'],['hacks','Hackathons'],['comms','Communities'],['templates','Study templates']];
function exportObj(){const d=JSON.parse(JSON.stringify(S));delete d.fired;delete d.ntfy;delete d.account;return {app:'AuraStudent',schema:1,exportedAt:new Date().toISOString(),data:d}}
function validateBackup(raw){
  const errs=[];let o;
  try{o=JSON.parse(raw)}catch(e){return {errs:['This is not valid JSON. The file may be damaged or is not an AuraStudent backup.']}}
  if(!o||typeof o!=='object'||o.app!=='AuraStudent')return {errs:['This file is not an AuraStudent backup. The "app" marker is missing.']};
  if(typeof o.schema!=='number'||o.schema<1||o.schema>1)return {errs:[`Unsupported backup version ${o.schema}. This app reads version 1.`]};
  const d=o.data;if(!d||typeof d!=='object'||Array.isArray(d))return {errs:['The backup has no "data" section.']};
  const list=(k,chk)=>{if(d[k]===undefined)return;if(!Array.isArray(d[k])){errs.push(`"${k}" must be a list.`);return}d[k].forEach((r,i)=>{const w=`${k} #${i+1}`;if(!r||typeof r!=='object'||Array.isArray(r)){errs.push(`${w}: not a record.`);return}if(typeof r.id!=='string'||!r.id){errs.push(`${w}: missing id.`);return}chk(r,w)})};
  const isStr=v=>typeof v==='string'&&v.trim().length>0,dOK=v=>v==null||v===''||(typeof v==='string'&&BDRE.test(v)),tOK=v=>v==null||v===''||(typeof v==='string'&&BTRE.test(v));
  list('events',(r,w)=>{if(!isStr(r.title))errs.push(`${w}: missing title.`);if(!BDRE.test(r.date||''))errs.push(`${w}: bad date.`);if(!BTRE.test(r.start||'')||!BTRE.test(r.end||''))errs.push(`${w}: bad start or end time.`);else if(mins(r.end)<=mins(r.start))errs.push(`${w}: end is not after start.`)});
  list('tasks',(r,w)=>{if(!isStr(r.title))errs.push(`${w}: missing title.`);if(!dOK(r.due))errs.push(`${w}: bad due date.`)});
  list('habits',(r,w)=>{if(!isStr(r.name))errs.push(`${w}: missing name.`)});
  list('items',(r,w)=>{if(!isStr(r.title))errs.push(`${w}: missing title.`);if(!dOK(r.date))errs.push(`${w}: bad date.`);if(!tOK(r.time))errs.push(`${w}: bad time.`)});
  list('hacks',(r,w)=>{if(!isStr(r.title))errs.push(`${w}: missing title.`);if(!Array.isArray(r.milestones))errs.push(`${w}: milestones must be a list.`);else r.milestones.forEach((m,j)=>{if(!m||typeof m.id!=='string'||!isStr(m.label)||!dOK(m.date)||!tOK(m.time))errs.push(`${w}, milestone ${j+1}: invalid.`)})});
  list('comms',(r,w)=>{if(!isStr(r.name))errs.push(`${w}: missing name.`);if(!dOK(r.renewal))errs.push(`${w}: bad renewal date.`)});
  list('templates',(r,w)=>{if(!isStr(r.name)||!isStr(r.title))errs.push(`${w}: missing name or title.`);if(!BTRE.test(r.start||''))errs.push(`${w}: bad start time.`);if(!Array.isArray(r.days)||r.days.some(x=>!Number.isInteger(x)||x<0||x>6))errs.push(`${w}: bad days.`)});
  if(d.profile!==undefined&&(typeof d.profile!=='object'||!d.profile||Array.isArray(d.profile)))errs.push('"profile" must be an object.');
  return {errs,o,d};
}

const NTFY_MAX_H=70,REOPEN_H=46;
const atMs=(date,min)=>{const [y,m,d]=date.split('-').map(Number);return new Date(y,m-1,d,Math.floor(min/60),min%60).getTime()};
const n2=n=>String(n).padStart(2,'0');
const dKey=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${n2(d.getMonth()+1)}-${n2(d.getDate())}`};
const clockT=ms=>{const d=new Date(ms);return `${n2(d.getHours())}:${n2(d.getMinutes())}`};
const whenTxt=ms=>{if(!ms)return 'Never';const k=dKey(ms),r=rel(k);return `${r==='Today'||r==='Tomorrow'||r==='Yesterday'?r:fd(k)} at ${clockT(ms)}`};
const hash36=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};

  if(/^(?:add|create|new|schedule|remind|open|go to|show|what|mark|move|delete)\b/.test(low)&&p.why!=='hkname')return false;
  if(p.q&&low.includes(vNorm(p.q).toLowerCase().slice(0,12)))return false;   // they said the whole thing again
  if(p.why==='ampm'||p.why==='hkampm'){
    const ap=/\b(?:am|a m|morning)\b/.test(low)?'am':/\b(?:pm|p m|evening|night|afternoon|tonight)\b/.test(low)?'pm':'';
    if(!ap)return 'again';
    const out=String(p.q).replace(/\b(at|by)\s+(\d{1,2})(?::(\d{2}))?(?!\s*(?:am|pm|a\.m|p\.m|:))/i,(m,w,h,mm)=>`${w} ${h}${mm?':'+mm:''} ${ap}`);
    return out===String(p.q)?false:out;
  }
  if(p.why==='past'){if(!/\d|\b(?:tomorrow|today|tonight|monday|tuesday|wednesday|thursday|friday|saturday|sunday|morning|evening)\b/.test(low))return 'again';
    return (String(p.q).replace(/\b(?:at|by)\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?/gi,' ').replace(/\b(today|tonight)\b/gi,' ')+' '+t).replace(/\s+/g,' ').trim()}
  if(p.why==='hktime'){if(!/\d/.test(low))return 'again';return `${p.q} at ${low.replace(/^(?:at|around|by)\s+/,'')}`}
  if(p.why==='hkname'){if(low.split(' ').length>4||/\d|\b(?:have|has|had|i|we|registered|register|started|start|ends?|remind|team|submitted|completed|ticked|done|finished|hackathon)\b/.test(low))return false;const n=String(t).replace(/\bhackathon\b/i,'').replace(/^(?:it(?:'s| is)|called|named)\s+/i,'').replace(/[.!?]+$/,'').trim();if(!n)return 'again';const nm=n.split(/\s+/).slice(0,4).join(' ');return String(p.q).replace(/\b(?:a |the |my |our )?hackathon\b/i,nm+' hackathon')}
  if(p.why==='hkdate'||p.why==='hkorder'){if(/hackathon/.test(low))return false;if(!/\b(?:start|started|starts|began|end|ends|ending)\b/.test(low))return 'again';const head=String(p.q).split(/\b(?:started|starts?|began|ends?|ending)\b/i)[0];return (head+' '+t).replace(/\s+/g,' ').trim()}

}

/* ===================== hands-free bridge for the Android app =====================
   The native Android service hears "Hey Aura, add task ...", then calls auraHandsFree(text, prior) in a hidden WebView.
   It reuses the normal voice parser (vParse / vRunRules) and the normal task list. It never saves unless the sentence is clear. */
function ahNum(p){const O={zero:0,oh:0,o:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9},T={ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50};let n=0;for(const w of String(p).trim().split(/\s+/)){if(w in T)n+=T[w];else if(w in O)n+=O[w]}return n}
function ahNorm(t){
  t=String(t||'').toLowerCase().replace(/[.,!?;]+/g,' ').replace(/\b([ap])\s+m\b/g,'$1m').replace(/\s+/g,' ').trim();
  const H='one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve',
        M='(?:(?:oh|o)\\s+(?:one|two|three|four|five|six|seven|eight|nine)|(?:ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen)|(?:twenty|thirty|forty|fifty)(?:\\s+(?:one|two|three|four|five|six|seven|eight|nine))?)';
  t=t.replace(new RegExp('\\b('+H+')(?:\\s+('+M+'))?\\s*(am|pm)\\b','g'),(m,h,mi,ap)=>ahNum(h)+(mi?':'+String(ahNum(mi)).padStart(2,'0'):'')+' '+ap);
  t=t.replace(new RegExp('\\b(at|by|before|around)\\s+('+H+')(?:\\s+('+M+'))?\\b(?!\\s*(?:am|pm))','g'),(m,w,h,mi)=>w+' '+ahNum(h)+(mi?':'+String(ahNum(mi)).padStart(2,'0'):''));

}
async function auraHandsFree(text,prior){
  const R=(status,say,x)=>Object.assign({status,say},x||{});

  try{
    let t=ahNorm(text).replace(/^(?:hey|hi|ok|okay|a)\s+(?:aura|aurora|ora|laura|ara|ira)\b\s*/,'').trim();
    if(prior&&prior.text){
      const p=ahNorm(prior.text);
      if(prior.why==='ampm'){const ap=/\b(am|pm)\b/.exec(t);if(!ap)return R('clarify','Please say a.m. or p.m.',{why:'ampm',text:prior.text});t=p.replace(/\bat\s+(\d{1,2})(?::(\d{2}))?(?!\s*(?:am|pm))/,(m,h,mm)=>'at '+h+(mm?':'+mm:'')+' '+ap[1])}
      else if(prior.why==='past')t=(p.replace(/\b(?:at|by)\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?/g,' ').replace(/\b(today|tonight)\b/g,' ')+' '+t).replace(/\s+/g,' ').trim();
      else if(prior.why==='title')t='add task '+t+' '+p.replace(/^(?:add|create|new)\s+(?:a\s+)?task\b/,'').trim();
      else t=(p+' '+t).trim();
    }
    if(!t)return R('clarify','Yes? Say: add task, then what and when.',{why:'empty',text:''});
    if(/^(?:add|create|new)\s+(?:a\s+)?(?:task|reminder|to do|todo)$/.test(t))return R('clarify','What is the task?',{why:'title',text:t});
    if(!/^(?:add|create|new|schedule|remind|i have|i need)\b/.test(t)&&!/\bremind me\b/.test(t))return R('unsupported','Say it like this: Hey Aura, add task, then what and when.');

    if(c.kind==='clarify')return R('clarify',c.why==='ampm'?'Is that reminder in the morning or the evening? Say a.m. or p.m.':'That time has already passed today. Say a later time or another day.',{why:c.why==='ampm'?'ampm':'past',text:t});
    if(c.kind!=='task')return R('unsupported','I can add tasks by voice. Open AuraStudent for anything else.');
    if(!c.title||!String(c.title).trim())return R('clarify','What is the task?',{why:'title',text:t});
    const hasClock=/\b(am|pm|noon|midnight)\b|\d:\d\d/.test(t),timeWord=c.time||c.remTime;
    if(timeWord&&!hasClock)return R('clarify','Is that in the morning or the evening? Say a.m. or p.m.',{why:'ampm',text:t});

    if(!made.length){
      if(cap.some(x=>/already in your tasks|did not add a duplicate/i.test(x)))return R('duplicate','That task is already in your list, so I did not add it again.');
      return R('failed','I could not add that. '+(cap[cap.length-1]||'Please try again.'));
    }

    /* persist now and read it back: only then do we say it was saved */
    try{localStorage.setItem(KEY,window.__lastRaw=JSON.stringify(S))}catch(e){return R('failed','I could not save it on this phone. It was not added.')}

    if(k.remDate&&k.remTime)at=D(k.remDate,k.remTime);else if(k.due)at=D(k.due,k.dueTime||'08:00');
    const say='Added: '+k.title+(k.due?', '+vDateSay(k.due)+(k.dueTime?' at '+vT12(k.dueTime):''):'')+'.'+(k.remTime&&k.remDate?' Reminder at '+vT12(k.remTime)+' '+vDateSay(k.remDate)+'.':'');
    return R('saved',say,{title:k.title,id:k.id,remindAt:at&&at>Date.now()?at:0});

async function sendBuddyRequest(name,code,extra){
  if(!invReady()){toast('The AuraStudent server is not set up in this copy of the app.');return}
  const m=ME();
  if(!m.name){toast('Add your name under Your buddy code first, so they know who sent the request.');return}
  if(hasBuddy(code)){toast('This person is already in your buddy list.');return}
  if(Object.values(reqOut()).some(r=>r.to===code&&r.status==='pending')){toast('You already sent this person a request. It is still pending.');return}
  if(Object.values(reqIn()).some(r=>r.from===code&&r.status==='pending')){toast('This person already sent you a request. Accept it under Buddy requests.');return}
  const id=('q'+uid()).toLowerCase().replace(/[^a-z0-9]/g,'');
  try{
    await buddyEnsure();
    const r=await invCall('/req/send',{to:code,id});
    reqOut()[id]={id,to:code,name,status:'pending',when:extra.when||'',courses:extra.courses||[],updated:Date.now()};save();render();
    toast(`Request sent to ${name}. It stays Pending until they accept.${r.pushed?'':' They will see it when they open the app.'}`);
  }catch(e){toast('Could not send the request: '+pushErr(e))}
}

}
