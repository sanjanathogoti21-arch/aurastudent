name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'native/**'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Capacitor
        working-directory: native
        run: npm install
      - name: Copy web app into the APK bundle
        working-directory: native
        run: bash build-www.sh
      - name: Create Android project and patch permissions + shortcut
        working-directory: native
        run: |
          npx cap add android
          node patch-android.js
          npx cap sync android
      - name: Download offline speech model (Vosk small English-India, about 36 MB)
        run: |
          D=native/android/app/src/main/assets/model
          mkdir -p $D /tmp/vm
          curl -fsSL -o /tmp/vm/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q /tmp/vm/m.zip -d /tmp/vm
          cp -r /tmp/vm/vosk-model-small-en-in-0.4/* $D/
          cat /proc/sys/kernel/random/uuid > $D/uuid
          ls $D
      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AuraStudent-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
