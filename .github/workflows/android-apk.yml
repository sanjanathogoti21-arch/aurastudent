name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'native/**'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Capacitor
        working-directory: native
        run: npm install
      - name: Copy web app into the APK bundle
        working-directory: native
        run: bash build-www.sh
      - name: Create Android project and patch permissions + shortcut
        working-directory: native
        run: |
          npx cap add android
          node patch-android.js
          npx cap sync android
      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AuraStudent-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
